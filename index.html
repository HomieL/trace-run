    svg.appendChild(sv('text', {class: 'ilabel strong', x: 4, y: outY + 13}, 'output'));
    this.outs = all.map(() => { const r = sv('rect', {class: 'obar', y: outY, height: 18, rx: 5, visibility: 'hidden'}); svg.appendChild(r); return r; });

    if (this.newBar){ const nv = z.newIv; this.newBar.setAttribute('x', X(nv[0])); this.newBar.setAttribute('width', Math.max(4, X(nv[1]) - X(nv[0]))); this.newLabel.textContent = `[${nv[0]}, ${nv[1]}]`;
      if (z.newGroup != null){ this.newBar.setAttribute('class', 'ibar grp'); this.newBar.style.setProperty('--tc', `var(${PALETTE[z.newGroup % PALETTE.length]})`); } else this.newBar.setAttribute('class', 'ibar newi'); }
    this.lineT.textContent = z.markLabel || 'lastEnd';

  }

VIZ.graph = {
  build(v, box){
    const n = v.n, layers = Math.max(...v.layer) + 1, cols = Array.from({length: layers}, () => []);
    for (let c = 0; c < n; c++) cols[v.layer[c]].push(c);
    const per = Math.max(...cols.map(c => c.length));
    const W = 680, H = Math.max(160, per * 78 + 40), r = 20, pos = {};
    cols.forEach((list, L) => list.forEach((c, k) => { pos[c] = {x: 50 + (L + .5) * (W - 100) / layers, y: (k + 1) * H / (list.length + 1)}; }));
    const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Prerequisite graph'});
    const defs = sv('defs');
    for (const [id, cls] of [['ah', 'ahp'], ['ahh', 'ahh']]){
      const mk = sv('marker', {id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse'});
      mk.appendChild(sv('path', {d: 'M0,0 L10,5 L0,10 z', class: cls})); defs.appendChild(mk);
    }
    svg.appendChild(defs);
    this.edges = v.edges.map(([a, b]) => {
      const p = pos[a], q = pos[b], dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      const path = sv('path', {class: 'gedge hidden', d: `M${p.x + ux * r},${p.y + uy * r} L${q.x - ux * (r + 3)},${q.y - uy * (r + 3)}`, 'marker-end': 'url(#ah)'});
      svg.appendChild(path); return {a, b, path};
    });
    this.nodes = []; this.badges = []; this.orders = [];
    for (let c = 0; c < n; c++){
      const {x, y} = pos[c];
      const g = sv('g', {class: 'node'});
      g.append(sv('circle', {class: 'halo', cx: x, cy: y, r}), sv('circle', {cx: x, cy: y, r}), sv('text', {x, y}, c));
      svg.appendChild(g); this.nodes.push(g);
      const b = sv('g', {class: 'badge'}); const bt = sv('text', {x: x + 16, y: y - 16});
      b.append(sv('circle', {cx: x + 16, cy: y - 16, r: 9}), bt); svg.appendChild(b); this.badges.push({b, bt});
      const o = sv('text', {class: 'order', x, y: y + r + 14}); svg.appendChild(o); this.orders.push(o);
    }
    box.appendChild(svg);
  },
  render(s){
    const z = s.viz, inq = new Set(z.q);
    this.edges.forEach(({a, b, path}, k) => {
      const hot = z.hot && z.hot[0] === a && z.hot[1] === b;
      path.setAttribute('class', 'gedge' + (k >= z.built ? ' hidden' : '') + (hot ? ' hot' : ''));
      path.setAttribute('marker-end', hot ? 'url(#ahh)' : 'url(#ah)');
    });
    this.nodes.forEach((g, c) => g.setAttribute('class', 'node ' + (c === z.cur ? 'active' : z.order[c] ? 'taken' : inq.has(c) ? 'inq' : '')));
    this.badges.forEach(({b, bt}, c) => { bt.textContent = z.indeg[c]; b.setAttribute('class', 'badge' + (z.indeg[c] === 0 ? ' zero' : '')); });
    this.orders.forEach((o, c) => { o.textContent = z.order[c] ? `#${z.order[c]}` : ''; });
  }
};

function openProblem(p, text){

function openTrace(t){

  $('#probTitle').textContent = t.title;

  $('#loader').hidden = !t.builtin;

/* ---------- rendering ---------- */
const isPrim = v => v === null || ['number','string','boolean'].includes(typeof v);
function show(v){
  const py = /python/i.test(trace.language || '');
  if (v === null) return py ? 'None' : 'null';
  if (typeof v === 'boolean') return py ? (v ? 'True' : 'False') : String(v);
  if (typeof v === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(show).join(', ') + ']';
  if (typeof v === 'object') return '{' + Object.entries(v).map(([k, x]) => `${k}: ${show(x)}`).join(', ') + '}';
  return String(v);
}

function renderVars(s, prev){
  let html = '';
  for (const [name, val] of Object.entries(s.vars || {})){
    const pv = prev && prev.vars ? prev.vars[name] : undefined;
    const changed = !!prev && JSON.stringify(pv) !== JSON.stringify(val);
    const note = trace.varNotes && trace.varNotes[name];
    const goal = trace.goal && trace.goal.var === name && Array.isArray(val) ? trace.goal : null;
    const ptrRaw = s.pointers && s.pointers[name];
    const ptrs = ptrRaw && typeof ptrRaw === 'object' ? ptrRaw : {};
    const grew = Array.isArray(pv) && Array.isArray(val) && val.length > pv.length;
    let right = '', body;
    if (goal){
      const total = Math.max(goal.total, val.length);
      let cells = '';
      for (let k = 0; k < total; k++) cells += k < val.length ? `<div class="slot got${grew && k === val.length - 1 ? ' new' : ''}">${esc(show(val[k]))}</div>` : '<div class="slot">?</div>';
      body = `<div class="slots">${cells}</div>`;
      right = `<span class="quest">${val.length >= goal.total ? `all ${goal.total} ${esc(goal.label)}` : `${val.length} of ${goal.total} ${esc(goal.label)}`}</span>`;
    } else if (Array.isArray(val) && val.every(isPrim)){
      const byIdx = {};
      for (const [lab, ix] of Object.entries(ptrs)) if (Number.isInteger(ix) && ix >= 0 && ix < val.length) (byIdx[ix] = byIdx[ix] || []).push(lab);
      const hasPtr = Object.keys(byIdx).length > 0;
      body = val.length
        ? `<div class="cells${hasPtr ? ' has-ptr' : ''}">${val.map((v, k) => `<div class="cell${byIdx[k] ? ' cur' : ''}${grew && k === val.length - 1 ? ' pop' : ''}">${esc(show(v))}<span class="idx">${k}</span>${byIdx[k] ? `<span class="ptr">▲ ${esc(byIdx[k].join(', '))}</span>` : ''}</div>`).join('')}</div>`
        : '<div class="cells"><span class="empty">[ ] empty</span></div>';
      right = Object.entries(ptrs).filter(([, i]) => Number.isInteger(i)).map(([l, i]) => `${esc(l)} = ${i}`).join(', ');
      if (right) right = `<span class="ptrs">${right}</span>`;
    } else if (Array.isArray(val)){
      body = val.length ? `<div class="chips">${val.map((v, k) => `<span class="chip${grew && k === val.length - 1 ? ' pop' : ''}">${esc(show(v))}</span>`).join('')}</div>` : '<span class="empty">[ ] empty</span>';
    } else if (val && typeof val === 'object'){
      const e = Object.entries(val);
      body = e.length ? `<div class="chips">${e.map(([k, v]) => `<span class="chip"><span class="t-s">${esc(k)}:</span> ${esc(show(v))}</span>`).join('')}</div>` : '<span class="empty">{ } empty</span>';
    } else {
      body = `<div class="chips"><span class="chip big">${esc(show(val))}</span></div>`;
    }
    html += `<div class="var${changed ? ' changed' : ''}"><div class="var-name"><span><span class="vn">${esc(name)}</span>${note ? ` <span class="t-s">${esc(note)}</span>` : ''}</span>${right}</div>${body}</div>`;
  }
  $('#vars').innerHTML = html || '<p class="empty">No variables yet.</p>';
}

function render(){
  const s = steps[cur], prev = steps[cur - 1];
  document.documentElement.style.setProperty('--ph', `var(${PHASE[s.phase] || '--cyan'})`);
  const seen = new Set(steps.slice(0, cur).map(x => x.line));
  lineEls.forEach((el, idx) => { el.classList.toggle('active', idx + 1 === s.line); el.classList.toggle('seen', seen.has(idx + 1)); });
  $('#phase').textContent = s.phase;
  $('#stepno').textContent = `step ${cur + 1} of ${steps.length}`;
  $('#bubble').textContent = s.narration || s.title;
  $('#exTitle').textContent = s.title;
  $('#exDesc').innerHTML = rich(s.desc || '');
  const cond = $('#cond'); cond.hidden = !s.cond; cond.textContent = s.cond || '';
  const note = trace.lineNotes && trace.lineNotes[s.line];
  $('#role').innerHTML = `<strong>Line ${s.line}</strong> ${note ? rich(note) : ''}`;
  renderVars(s, prev);
  const st = s.stack || [];
  $('#frames').innerHTML = st.length
    ? [...st].reverse().map((f, k) => `<div class="frame${k === 0 ? ' top' : ''}${k === st.length - 1 && st.length > 1 ? ' root' : ''}">${esc(f)}</div>`).join('')
    : '<span class="empty">empty</span>';
  $('#depth').textContent = st.length ? plural(st.length, 'frame') : '';
  if (viz && s.viz) viz.render(s);
  const sc = $('#scrub');
  sc.max = steps.length - 1; sc.value = cur;
  sc.style.setProperty('--pct', (steps.length > 1 ? cur / (steps.length - 1) * 100 : 100) + '%');
  $('#count').textContent = `${cur + 1}/${steps.length}`;
  $('#prevBtn').disabled = cur === 0;
  $('#nextBtn').disabled = cur === steps.length - 1;
  $('#nextBtn').textContent = cur === steps.length - 1 ? 'Done' : 'Next';
  const bit = $('#bit'); bit.classList.remove('hop'); void bit.getBoundingClientRect(); bit.classList.add('hop');
}

/* ---------- voice ---------- */
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /^en[-_]/i.test(v.lang) && /Samantha|Google US English|Aria|Jenny|Zira|Karen|Moira/i.test(v.name))
      || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
const forSpeech = t => String(t).replace(/`/g, '').replace(/\[\s*\]/g, 'an empty list').replace(/\[([^\]]*)\]/g, ' $1 ')
  .replace(/>=/g, ' is at least ').replace(/<=/g, ' is at most ').replace(/!=/g, ' is not ').replace(/==/g, ' equals ').replace(/→/g, ', ');
function speak(text, done){
  const id = ++speakId, bit = $('#bit');
  if (!voiceOn || !canSpeak){ done && done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(forSpeech(text));
  const v = pickVoice(); if (v) u.voice = v;
  u.pitch = 1.55; u.rate = 1.05;
  let finished = false;
  const fin = () => { if (finished) return; finished = true; if (id === speakId){ bit.classList.remove('talking'); done && done(); } };
  u.onstart = () => { if (id === speakId) bit.classList.add('talking'); };
  u.onend = fin; u.onerror = fin;
  setTimeout(fin, 15000);
  speechSynthesis.speak(u);
}
function setVoice(on){
  voiceOn = on;
  const b = $('#voiceBtn'); b.setAttribute('aria-pressed', String(on)); b.firstChild.textContent = on ? '🔊' : '🔈';
  if (on) speak(steps[cur].narration || steps[cur].title);
  else if (canSpeak){ speechSynthesis.cancel(); $('#bit').classList.remove('talking'); }
}

/* ---------- stepping ---------- */
function go(k){
  cur = Math.max(0, Math.min(steps.length - 1, k));
  render();
  const my = ++tick;
  const after = () => {
    if (!playing || my !== tick) return;
    if (cur >= steps.length - 1){ stopPlay(); return; }
    playTimer = setTimeout(() => go(cur + 1), voiceOn ? 250 : +$('#speed').value);
  };
  if (voiceOn) speak(steps[cur].narration || steps[cur].title, after); else after();
}
function stopPlay(){ playing = false; clearTimeout(playTimer); const b = $('#playBtn'); b.textContent = '▶︎'; b.setAttribute('aria-label', 'Play'); }
function togglePlay(){
  if (playing){ stopPlay(); return; }
  playing = true; const b = $('#playBtn'); b.textContent = '❚❚'; b.setAttribute('aria-label', 'Pause');
  go(cur >= steps.length - 1 ? 0 : cur + 1);
}
function step(k){ stopPlay(); go(k); }

/* ---------- tracing new code with Claude ---------- */
const samplePromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
let ctl = null;
function status(msg, kind = ''){ const el = $('#status'); el.textContent = msg; el.className = 'status' + (kind ? ' ' + kind : ''); }
function busy(on){ $('#traceBtn').disabled = on; $('#traceBtn').textContent = on ? 'Tracing…' : 'Trace it'; $('#stopBtn').hidden = !on; $('#codeIn').readOnly = on; $('#exIn').readOnly = on; }
function errCopy(e){
  switch (e && e.code){
    case 'cancelled': return 'Stopped.';
    case 'not_granted': return 'Claude wasn’t allowed to run, so this code can’t be traced. Allow it when asked, then trace again.';
    case 'rate_limited': return 'Too many requests at once. Wait a minute, then trace again.';
    case 'invalid_json': case 'bad_shape': return 'The trace came back incomplete. Try a shorter snippet or a smaller example input.';
    case 'prompt_too_large': return 'That code is too long to trace. Trim it to one function.';
    default: return 'Tracing failed. Try again in a moment.';
  }
}
function buildPrompt(code, example){
  const numbered = code.split('\n').map((l, i) => `${i + 1}| ${l}`).join('\n');
  return `You are generating a step-by-step execution trace for an interactive, game-like code visualizer that helps students understand algorithms line by line.

CODE (line numbers were added and are not part of the code):
${numbered}

EXAMPLE INPUT: ${example || 'none given. Choose a small input that shows the interesting behavior, and say what it is in "example".'}

Rules:
- Mentally execute the code on the example input. Record one step per executed line, in execution order, with exact values. Accuracy matters more than anything else; double-check every value.
- Use between 12 and 70 steps. If a full run would be longer, pick a smaller input (or, if the user gave the input, trace the start and finish with a Done step that says what the rest would do).
- Skip blank lines and comments. Use a function's def/signature line for the step where the function is entered.
- "vars": the variables in scope AFTER the line runs, as JSON values (lists/sets as arrays, dicts as objects). At most 8 variables; leave out self and type hints.
- "pointers": for any array variable indexed by an integer variable, map the index names to their values, e.g. {"nums": {"i": 0, "j": 3}}. Only in-range indices.
- "stack": the call stack, outermost first, as short labels like "dfs(i=1)".
- "phase": exactly one of Setup, Start, Enter, Check, Compare, Choose, Explore, Loop, Backtrack, Collect, Update, Return, Done.
- "condition": for if/while/loop checks, the evaluated condition such as "2 < 3 → True"; otherwise "".
- "explain": 1–2 plain sentences on what this line just did, using the real values. Put code in backticks.
- "narration": at most 25 words, spoken aloud by Bit, a cheerful little robot guide. Playful and warm but accurate. Never reference existing characters, franchises, or celebrities.
- "tags": 2 to 5 recognizable algorithm patterns or techniques in the code (for example Two pointers, Sliding window, Binary search, BFS, DFS, Backtracking, Recursion, Dynamic programming, Memoization, Greedy, Hash map, Stack, Heap, Sorting, Prefix sum, Union find, Topological sort). Each has "name", "lines" (the line numbers that show it) and "why" (one sentence, may use backticks).
- "line_notes": for each line that runs, a short general note on what that line is for.
- "goal": if the code fills a result collection whose final size you know, {"var": name, "total": size, "label": "collected"}; otherwise null.
- If the text is not code, reply {"error": "a one-sentence explanation"}.

Reply with only JSON in this shape:
{"title":"short problem name","summary":"one sentence on what the code does","language":"Python","example":"the input you traced","complexity":"O(n) time, O(1) space","tags":[{"name":"Hash map","lines":[4,6],"why":"..."}],"line_notes":{"3":"..."},"var_notes":{"seen":"value → index"},"goal":null,"steps":[{"line":3,"phase":"Setup","title":"short title","explain":"...","narration":"...","condition":"","vars":{},"pointers":{},"stack":["twoSum(nums, target)"]}]}`;
}
function normalize(raw, code){
  if (!raw || !Array.isArray(raw.steps) || !raw.steps.length) throw {code: 'bad_shape'};
  const nLines = code.split('\n').length;
  const str = (v, max) => v == null ? '' : String(v).slice(0, max);
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const stepsOut = raw.steps.slice(0, 150).map(s => {
    s = isObj(s) ? s : {};
    const ph = str(s.phase, 20), phase = PHASE[ph] ? ph : 'Update';
    return {line: Math.min(nLines, Math.max(1, parseInt(s.line, 10) || 1)), phase,
      title: str(s.title, 90) || phase, desc: str(s.explain, 500), narration: str(s.narration, 260),
      cond: str(s.condition, 140), vars: isObj(s.vars) ? s.vars : {}, pointers: isObj(s.pointers) ? s.pointers : {},
      stack: Array.isArray(s.stack) ? s.stack.map(x => str(x, 80)) : []};
  });
  const tags = (Array.isArray(raw.tags) ? raw.tags : []).slice(0, 6).filter(isObj).map((t, k) => ({
    name: str(t.name, 30), c: TAG_COLORS[k % TAG_COLORS.length],
    lines: (Array.isArray(t.lines) ? t.lines : []).map(x => parseInt(x, 10)).filter(x => x >= 1 && x <= nLines),
    why: str(t.why, 260)})).filter(t => t.name);
  const lineNotes = {}; if (isObj(raw.line_notes)) for (const [k, v] of Object.entries(raw.line_notes)) lineNotes[parseInt(k, 10)] = str(v, 200);
  const varNotes = {}; if (isObj(raw.var_notes)) for (const [k, v] of Object.entries(raw.var_notes)) varNotes[k] = str(v, 60);
  let goal = null;
  if (isObj(raw.goal) && typeof raw.goal.var === 'string' && Number.isInteger(raw.goal.total) && raw.goal.total > 0 && raw.goal.total <= 64)
    goal = {var: raw.goal.var, total: raw.goal.total, label: str(raw.goal.label, 30) || 'collected'};
  const sub = [str(raw.summary, 220), raw.example ? `Traced with ${str(raw.example, 140)}.` : ''].filter(Boolean).join(' ');
  return {id: 't' + Date.now(), title: str(raw.title, 60) || 'Your code', subtitle: sub, language: str(raw.language, 20),
    code, tags, complexity: str(raw.complexity, 60), lineNotes, varNotes, goal, steps: stepsOut, visual: null};
}
async function traceIt(){
  const code = $('#codeIn').value.replace(/\t/g, '    ').replace(/\s+$/, '').replace(/^\s*\n/, '');
  if (!code.trim()){ status('Paste some code first.', 'bad'); return; }
  if (code.length > 8000 || code.split('\n').length > 150){ status('That’s a lot of code. Trim it to one function or solution under 150 lines.', 'bad'); return; }
  busy(true); status('Bit is reading your code. This usually takes 20–60 seconds.', 'work');
  const sample = await samplePromise;
  if (!sample){ busy(false); status('Tracing new code needs Claude, which only works when this page is open in Claude.', 'bad'); return; }
  ctl = new AbortController();
  try {
    const raw = await sample.json(buildPrompt(code, $('#exIn').value.trim()), {
      signal: ctl.signal,
      onText: ({text}) => { const k = (text.match(/"line"\s*:/g) || []).length; if (k) status(`Tracing… ${plural(k, 'step')} so far`, 'work'); }
    });
    if (raw && raw.error){ status(String(raw.error).slice(0, 200), 'bad'); return; }
    const t = normalize(raw, code);
    library.unshift(t); library = library.slice(0, 40); saveLib();
    fillLibSel(t.id);
    $('#compose').hidden = true; status('');
    openTrace(t);
    window.scrollTo({top: 0, behavior: 'smooth'});
  } catch (e){
    status(errCopy(e), e && e.code === 'cancelled' ? '' : 'bad');
  } finally { busy(false); }
}

/* ---------- wiring ---------- */
const currentProblem = () => PROBLEMS.find(p => p.id === (trace && trace.id));
$('#nextBtn').onclick = () => step(cur + 1);
$('#prevBtn').onclick = () => step(cur - 1);
$('#resetBtn').onclick = () => step(0);
$('#playBtn').onclick = togglePlay;
$('#scrub').oninput = e => step(+e.target.value);
$('#loadBtn').onclick = () => { const p = currentProblem(); if (p) openProblem(p, $('#argIn').value); };
$('#argIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loadBtn').click(); });
$('#voiceBtn').onclick = () => setVoice(!voiceOn);
if (!canSpeak) $('#voiceBtn').hidden = true;
if (!(window.claude && typeof window.claude.use === 'function')) $('#newBtn').hidden = true;
$('#newBtn').onclick = () => { $('#compose').hidden = false; $('#codeIn').focus(); };
$('#closeBtn').onclick = () => { if (ctl) ctl.abort(); $('#compose').hidden = true; };
$('#stopBtn').onclick = () => { if (ctl) ctl.abort(); };
$('#traceBtn').onclick = traceIt;
$('#codeIn').addEventListener('keydown', e => {
  if (e.key === 'Tab'){ e.preventDefault(); const t = e.target, a = t.selectionStart; t.setRangeText('    ', a, t.selectionEnd, 'end'); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) traceIt();
});
$('#libSel').onchange = e => {
  const id = e.target.value, p = PROBLEMS.find(x => x.id === id);
  $('#delBtn').hidden = !!p; $('#err').textContent = '';
  if (p) openProblem(p, p.input);
  else { const t = library.find(x => x.id === id); if (t) openTrace(t); }
};
$('#delBtn').onclick = () => {
  const id = $('#libSel').value;
  library = library.filter(t => t.id !== id); saveLib();
  fillLibSel('lc78'); openProblem(PROBLEMS[0], PROBLEMS[0].input);
};
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); step(cur + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(cur - 1); }
  else if (e.key === ' '){ e.preventDefault(); togglePlay(); }
});

loadLib();
const startP = PROBLEMS.find(p => '#' + p.id === location.hash) || PROBLEMS[0];
fillLibSel(startP.id);
openProblem(startP, startP.input);

</script>
</body>
</html>
