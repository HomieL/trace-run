<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trace.run — interview algorithms, step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1fa; --grid:rgba(40,52,120,.07); --panel:#ffffff; --panel-2:#f3f5fc; --border:#d6dcef; --screen:#1b2150;
  --text:#141a3a; --muted:#56608a; --dim:#9aa3c7;
  --cyan:#0a8fb0; --mint:#119a64; --amber:#b77a00; --coral:#d9483b; --violet:#6b4fd8; --pink:#c43a86;
  --k:#6b4fd8; --f:#0a7fa0; --n:#b77a00; --c:#119a64; --s:#8790b8;
  --ph:var(--cyan);
  --ui:"Sora", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1030; --grid:rgba(120,140,255,.07); --panel:#131a45; --panel-2:#19215a; --border:#26307a; --screen:#070a22;
    --text:#e6e9ff; --muted:#a3aad6; --dim:#5b64a3;
    --cyan:#4fd8f5; --mint:#4ee6a1; --amber:#ffc24d; --coral:#ff7a6b; --violet:#a994ff; --pink:#ff7cc4;
    --k:#a994ff; --f:#4fd8f5; --n:#ffc24d; --c:#4ee6a1; --s:#6c75b5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1030; --grid:rgba(120,140,255,.07); --panel:#131a45; --panel-2:#19215a; --border:#26307a; --screen:#070a22;
  --text:#e6e9ff; --muted:#a3aad6; --dim:#5b64a3;
  --cyan:#4fd8f5; --mint:#4ee6a1; --amber:#ffc24d; --coral:#ff7a6b; --violet:#a994ff; --pink:#ff7cc4;
  --k:#a994ff; --f:#4fd8f5; --n:#ffc24d; --c:#4ee6a1; --s:#6c75b5;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; font-family:var(--ui); color:var(--text); background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; font-size:15px; line-height:1.55; padding-bottom:96px;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
.brand{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .cursor{display:inline-block;width:10px;height:20px;background:var(--cyan);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lib{display:flex;gap:6px;align-items:center}
.select{-webkit-appearance:none;appearance:none;border:1px solid var(--border);background:var(--panel);border-radius:10px;height:40px;padding:0 40px 0 12px;font-size:14px;max-width:260px;cursor:pointer}
.sel-wrap{position:relative;display:inline-flex}
.sel-wrap::after{content:"";position:absolute;right:17px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ghost{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-new{border:1.5px solid var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent);color:var(--cyan);border-radius:10px;height:40px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn-new:hover{background:color-mix(in srgb,var(--cyan) 22%,transparent)}

.titlebar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:14px}
.problem{flex:1;min-width:220px;font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.problem small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px;max-width:70ch}
.loader{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px 6px 6px 12px}
.loader label{font-family:var(--mono);font-size:13px;color:var(--muted)}
.loader input{width:min(340px,52vw);border:0;background:transparent;font-family:var(--mono);font-size:14px;padding:6px 4px}
.loader input:focus{outline:none}
.loader button{border:0;background:var(--panel-2);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.err{font-size:13px;color:var(--coral);margin:-6px 0 10px}
.err:empty{display:none}

/* cards */
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:14px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 .aside{font-weight:400;color:var(--muted);font-size:12.5px}

/* compose */
.compose{margin-bottom:14px;border-color:var(--cyan)}
.compose textarea{width:100%;min-height:220px;resize:vertical;font-family:var(--mono);font-size:13.5px;line-height:1.6;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;tab-size:4}
.compose .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.compose input{flex:1;min-width:220px;height:42px;border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:0 12px;font-family:var(--mono);font-size:13.5px}
.status{margin:10px 0 0;font-size:14px;color:var(--muted);min-height:1.4em}
.status.bad{color:var(--coral)}
.status.work::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-right:8px;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.2}}

/* pattern scan */
.scan{margin-bottom:14px;display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center}
.scan h2{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{--tc:var(--cyan);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 10%,transparent);color:var(--tc);font-family:var(--mono);font-size:13px;font-weight:500;padding:5px 11px;border-radius:999px;cursor:pointer}
.tag:hover{background:color-mix(in srgb,var(--tc) 20%,transparent)}
.tag[aria-pressed="true"]{background:var(--tc);color:var(--panel)}
.tag.cx{--tc:var(--muted);cursor:default;background:transparent}
.why{grid-column:1/-1;margin:0;font-size:14px;color:var(--muted);min-height:1.5em}
.why b{color:var(--text);font-weight:600}

/* grid */
.main{display:flex;gap:14px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col.left{flex:1 1 0}.col.right{flex:1.2 1 0}



/* code */
.file{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-weight:400}
.code{font-family:var(--mono);font-size:13.5px;line-height:1.95;overflow-x:auto;border-radius:10px;background:var(--panel-2);padding:8px 0}
.ln{display:flex;border-left:3px solid transparent}
.ln .no{flex:0 0 2.8em;text-align:right;padding-right:1em;color:var(--dim);user-select:none}
.ln .src{white-space:pre;padding-right:1.2em}
.ln.seen .no{color:var(--muted)}
.ln.ev{background:color-mix(in srgb,var(--tagc) 12%,transparent);border-left-color:color-mix(in srgb,var(--tagc) 60%,transparent)}
.ln.active{background:color-mix(in srgb,var(--ph) 20%,transparent);border-left-color:var(--ph)}
.ln.active .no{color:var(--ph);font-weight:700}
.t-k{color:var(--k)}.t-f{color:var(--f)}.t-n{color:var(--n)}.t-c{color:var(--c)}.t-s{color:var(--s)}

/* explain + narrator */
.explain{border-color:color-mix(in srgb,var(--ph) 55%,var(--border));box-shadow:0 0 0 1px color-mix(in srgb,var(--ph) 18%,transparent)}
.ex-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.phase{background:var(--ph);color:var(--panel);font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px}
.stepno{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-left:auto}
.narr{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.bit{width:60px;height:60px;flex:0 0 60px;overflow:visible}
.bit .head{fill:var(--panel-2);stroke:var(--ph);stroke-width:2.5}
.bit .screen{fill:var(--screen)}
.bit .eye{fill:var(--ph);animation:blinkEye 4.5s infinite;transform-box:fill-box;transform-origin:center}
.bit .mouth{fill:var(--ph);transform-box:fill-box;transform-origin:center}
.bit .ant{stroke:var(--ph);stroke-width:2.5}
.bit .tip{fill:var(--ph)}
.bit .base{fill:var(--ph);opacity:.5}
.bit.talking .mouth{animation:talk .2s ease-in-out infinite alternate}
.bit.hop{animation:hop .35s ease-out}
@keyframes blinkEye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(2.6)}}
@keyframes hop{40%{transform:translateY(-5px)}}
.bubble{position:relative;flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:10px 14px;font-size:15px;min-height:48px}
.bubble::before{content:"";position:absolute;left:-7px;top:20px;width:12px;height:12px;background:var(--panel-2);border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
.bubble .who{display:block;font-size:12px;color:var(--ph);font-weight:600;margin-bottom:2px}
.ex-title{font-size:21px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px;line-height:1.25}
.ex-desc{margin:0 0 12px;font-size:15px;max-width:62ch}
.ex-desc code,.role code,.why code{font-family:var(--mono);font-size:.9em;background:var(--panel-2);padding:1px 5px;border-radius:5px}
.cond{font-family:var(--mono);font-size:14px;background:var(--panel-2);border:1px dashed color-mix(in srgb,var(--ph) 60%,transparent);border-radius:8px;padding:8px 12px;margin:0 0 12px;display:inline-block}
.role{font-size:13.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin:0}
.role strong{color:var(--text);font-weight:600}

/* variables */
.var{margin-bottom:14px}
.var:last-child{margin-bottom:0}
.var-name{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.var-name .vn{color:var(--text);font-weight:500}
.var.changed .vn{color:var(--ph)}
.var.changed .vn::after{content:" changed";font-family:var(--ui);font-size:11px;font-weight:600;margin-left:6px;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--ph) 18%,transparent)}
.ptrs{color:var(--cyan)}
.cells{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;align-items:flex-start}
.cells.has-ptr{padding-bottom:20px}
.cell{font-family:var(--mono);font-weight:700;min-width:40px;height:40px;padding:0 8px;display:grid;place-items:center;border-radius:9px;border:1.5px solid var(--border);background:var(--panel-2);position:relative}
.cell .idx{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:500;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:0 4px;line-height:1.4;color:var(--muted)}
.cell .ptr{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--cyan);white-space:nowrap}
.cell.cur{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--cyan)}
.cell.pop,.chip.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:.3}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:13.5px;border:1.5px solid var(--border);background:var(--panel-2);border-radius:8px;padding:4px 10px}
.chip.big{font-size:16px;font-weight:700;padding:6px 14px}
.empty{font-family:var(--mono);color:var(--dim);font-size:14px;line-height:40px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.slot{font-family:var(--mono);font-size:13px;min-height:36px;padding:4px;border-radius:8px;border:1.5px dashed var(--border);display:grid;place-items:center;color:var(--dim);text-align:center}
.slot.got{border-style:solid;border-color:color-mix(in srgb,var(--pink) 55%,transparent);background:color-mix(in srgb,var(--pink) 10%,transparent);color:var(--text);font-weight:500}
.slot.new{animation:pop .4s ease-out;border-color:var(--pink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 25%,transparent)}
.quest{font-family:var(--ui);color:var(--pink);font-weight:600}

/* stack */
.frames{display:flex;flex-direction:column;gap:6px}
.frame{font-family:var(--mono);font-size:13.5px;border:1.5px solid var(--border);border-radius:9px;padding:7px 12px;background:var(--panel-2);overflow-wrap:anywhere}
.frame.top{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,transparent)}
.frame.root{border-style:dashed;color:var(--muted)}

/* tree */
.tree-wrap{overflow-x:auto}
.tree-wrap svg{display:block;width:100%;min-width:480px;height:auto}
.edge{stroke:var(--border);stroke-width:1.6;fill:none}
.edge.seen{stroke:var(--dim)}
.edge.path{stroke:var(--cyan);stroke-width:3}
.elabel{font-family:var(--mono);font-size:11px;fill:var(--dim)}
.elabel.take{fill:var(--mint)}
.elabel.path{fill:var(--cyan);font-weight:700}
.node circle{fill:var(--panel);stroke:var(--border);stroke-width:1.6}
.node text{font-family:var(--mono);font-size:12px;fill:var(--dim);text-anchor:middle;dominant-baseline:central;font-weight:700}
.node.done circle{fill:var(--panel-2);stroke:var(--dim)}
.node.done text{fill:var(--muted)}
.node.stack circle{stroke:var(--cyan);stroke-width:2.5}
.node.stack text{fill:var(--cyan)}
.node.active circle{fill:var(--ph);stroke:var(--ph);stroke-width:2.5}
.node.active text{fill:var(--panel)}
.halo{fill:none;stroke:var(--ph);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.node.active .halo{opacity:1;animation:halo 1.4s ease-out infinite}
@keyframes halo{0%{transform:scale(1);stroke-opacity:.8}100%{transform:scale(1.8);stroke-opacity:0}}
.node.leaf circle{fill:color-mix(in srgb,var(--pink) 22%,var(--panel));stroke:var(--pink)}
.node.leaf text{fill:var(--pink)}
.llabel{font-family:var(--mono);fill:var(--dim);text-anchor:middle}
.llabel.got{fill:var(--pink);font-weight:700}
.depth{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--c)}
.legend .l1{--c:var(--cyan)}.legend .l2{--c:var(--dim)}.legend .l3{--c:var(--pink)}


.ret{font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--amber)}
.node.pruned circle{fill:color-mix(in srgb,var(--coral) 12%,var(--panel));stroke:var(--coral);stroke-dasharray:3 3}
.node.pruned text{fill:var(--coral)}
.edge.pruned{stroke:var(--coral);stroke-dasharray:4 4}
.elabel.pruned{fill:var(--coral)}
.node.inq circle{stroke:var(--cyan);stroke-width:2.5;stroke-dasharray:4 3}
.node.inq text{fill:var(--cyan)}
.node.lvl circle{fill:color-mix(in srgb,var(--tc) 30%,var(--panel));stroke:var(--tc)}
.node.lvl text{fill:var(--text)}
.node.taken circle{fill:color-mix(in srgb,var(--mint) 28%,var(--panel));stroke:var(--mint)}
.node.taken text{fill:var(--text)}
.legend span::before{border-color:var(--c)}
/* grid viz */
.gv{display:grid;gap:5px;align-items:center;justify-content:start}
.gh{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.gcell{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--border);display:grid;place-items:center;position:relative;font-family:var(--mono);font-size:14px;background:var(--panel-2)}
.gcell b{font-weight:700}
.gcell i{position:absolute;bottom:1px;right:4px;font-style:normal;font-size:10px;color:var(--muted)}
.gcell.land{background:color-mix(in srgb,var(--amber) 24%,var(--panel));border-color:color-mix(in srgb,var(--amber) 60%,transparent)}
.gcell.water{background:color-mix(in srgb,var(--cyan) 6%,var(--panel));color:var(--dim)}
.gcell.sunk{background:color-mix(in srgb,var(--tc) 30%,var(--panel));border-color:var(--tc)}
.gcell.sunk i{color:var(--text);font-weight:600}
.gcell.gempty{border-style:dashed;background:transparent}
.gcell.fresh::before,.gcell.rotten::before{content:"";width:54%;height:54%;border-radius:50%;background:var(--amber)}
.gcell.rotten::before{background:color-mix(in srgb,var(--coral) 65%,#4a2e14)}
.gcell.inq{border-color:var(--cyan);border-width:2.5px}
.gcell.gscan{box-shadow:0 0 0 2px var(--muted)}
.gcell.path{outline:2px solid var(--cyan);outline-offset:1px}
.gcell.probe{outline:3px dashed var(--coral);outline-offset:2px}
.gcell.cur{outline:3px solid var(--ph);outline-offset:2px}
/* intervals viz */
.ibar{fill:var(--panel-2);stroke:var(--border);stroke-width:1.5}
.ibar.grp{fill:color-mix(in srgb,var(--tc) 30%,var(--panel));stroke:var(--tc)}
.ibar.cur{fill:var(--ph);stroke:var(--ph)}
.ibar.newi{fill:color-mix(in srgb,var(--pink) 22%,var(--panel));stroke:var(--pink);stroke-dasharray:5 3}
.obar{fill:color-mix(in srgb,var(--tc) 50%,var(--panel));stroke:var(--tc);stroke-width:1.5}
.ilabel{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.ilabel.strong{fill:var(--text);font-weight:600}
.lastend{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 4}
.lastend-t{font-family:var(--mono);font-size:11px;fill:var(--amber);font-weight:700}
.axis{stroke:var(--dim);stroke-width:1}
/* graph viz */
.gedge{stroke:var(--dim);stroke-width:1.8;fill:none}
.gedge.hidden{opacity:0}
.gedge.hot{stroke:var(--ph);stroke-width:3}
.ahp{fill:var(--dim)}.ahh{fill:var(--ph)}
.badge circle{fill:var(--amber)}
.badge.zero circle{fill:var(--mint)}
.badge text{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--panel);text-anchor:middle;dominant-baseline:central}
.order{font-family:var(--mono);font-size:11px;fill:var(--mint);text-anchor:middle;font-weight:700}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--border);background:var(--panel-2);border-radius:10px;height:42px;min-width:42px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--cyan)}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--ph);border-color:var(--ph);color:var(--panel);padding:0 20px;min-width:100px}
.compose .btn.go{--ph:var(--cyan)}
.btn[aria-pressed="true"]{border-color:var(--ph);color:var(--ph);background:color-mix(in srgb,var(--ph) 14%,transparent)}
.scrub{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--ph) var(--pct,0%),var(--border) var(--pct,0%));cursor:pointer}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--panel);border:3px solid var(--ph)}

}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">trace.run<span class="cursor" aria-hidden="true"></span></div>
    <div class="lib">
      <label for="libSel" class="sr">Open a problem</label>
      <span class="sel-wrap"><select id="libSel" class="select"></select></span>
      <button id="delBtn" class="ghost" type="button" hidden>Remove</button>
    </div>
    <button id="newBtn" class="btn-new" type="button">Trace your own code</button>
  </header>

  <section class="card compose" id="compose" hidden>
    <h2>Trace your own code <span class="aside">Python, JavaScript, Java, C++ and more, up to 150 lines</span></h2>
    <label for="codeIn" class="sr">Code</label>
    <textarea id="codeIn" spellcheck="false" placeholder="Paste a function or a full solution here"></textarea>
    <div class="row">
      <label for="exIn" class="sr">Example input</label>
      <input id="exIn" spellcheck="false" placeholder="Example input (optional), e.g. nums = [2, 7, 11, 15], target = 9">
      <button id="traceBtn" class="btn go" type="button">Trace it</button>
      <button id="stopBtn" class="btn" type="button" hidden>Stop</button>
      <button id="closeBtn" class="btn" type="button">Close</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <div class="titlebar">
    <div class="problem"><span id="probTitle"></span><small id="probSub"></small></div>
    <div class="loader" id="loader">
      <label for="argIn">Input</label>
      <input id="argIn" spellcheck="false" autocomplete="off">
      <button id="loadBtn" type="button">Run</button>
    </div>
  </div>
  <p class="err" id="err" role="status"></p>

  <section class="card scan" aria-label="Detected patterns">
    <h2>Patterns detected</h2>
    <div class="tags" id="tags"></div>
    <p class="why" id="why"></p>
  </section>

  <main class="main">
    <div class="col left" id="colLeft">
      <section class="card code-card">
        <h2>Code <span class="file" id="fileName">python</span></h2>
        <div class="code" id="code"></div>
      </section>
      <section class="card state" id="stateCard">
        <h2>Variables</h2>
        <div id="vars"></div>
      </section>
      <section class="card stack-card" id="stackCard">
        <h2>Call stack <span class="aside" id="depth"></span></h2>
        <div class="frames" id="frames"></div>
      </section>
    </div>
    <div class="col right" id="colRight">
      <section class="card explain">
        <div class="ex-top"><span class="phase" id="phase"></span><span class="stepno" id="stepno"></span></div>
        <div class="narr">
          <svg class="bit" id="bit" viewBox="0 0 64 64" aria-hidden="true">
            <line class="ant" x1="32" y1="5" x2="32" y2="13"/>
            <circle class="tip" cx="32" cy="5" r="4"/>
            <rect class="head" x="8" y="13" width="48" height="39" rx="14"/>
            <rect class="screen" x="14" y="19" width="36" height="25" rx="8"/>
            <circle class="eye" cx="25" cy="29" r="3.3"/>
            <circle class="eye" cx="39" cy="29" r="3.3"/>
            <rect class="mouth" x="27" y="36" width="10" height="3" rx="1.5"/>
            <rect class="base" x="20" y="55" width="24" height="5" rx="2.5"/>
          </svg>
          <div class="bubble"><span class="who">Bit says</span><span id="bubble"></span></div>
        </div>
        <h3 class="ex-title" id="exTitle"></h3>
        <p class="ex-desc" id="exDesc" aria-live="polite"></p>
        <div class="cond" id="cond" hidden></div>
        <p class="role" id="role"></p>
      </section>
      <section class="card viz-card" id="vizCard">

        <div class="tree-wrap" id="viz"></div>

      </section>
    </div>
  </main>
</div>

<nav class="dock" aria-label="Step controls">
  <div class="dock-in">
    <button class="btn" id="resetBtn" type="button" title="Restart" aria-label="Restart">⟲</button>

<script>
/* ================= shared helpers ================= */
const clone = x => JSON.parse(JSON.stringify(x));
const fmt = a => '[' + a.join(', ') + ']';
const PALETTE = ['--mint','--violet','--amber','--pink','--cyan','--coral'];
const plural = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;

function lineFinder(code){
  const lines = code.split('\n');
  const L = (needle, nth = 1) => {
    if (needle.startsWith('=')) return L.exact(needle.slice(1));
    let k = 0;
    for (let i = 0; i < lines.length; i++) if (lines[i].includes(needle) && ++k === nth) return i + 1;
    throw new Error('No line: ' + needle);
  };
  L.exact = t => { const i = lines.findIndex(l => l.trim() === t); if (i < 0) throw new Error('No line: ' + t); return i + 1; };
  return L;
}
function recorder(stateFn){
  const steps = [];
  const rec = (line, phase, title, desc, narration = '', cond = '') =>
    steps.push({line, phase, title, desc, narration, cond, ...clone(stateFn())});
  rec.steps = steps;
  return rec;
}
function makeTree(){
  const nodes = [];
  const add = (parent, label, edge = '', cap = '') => {
    const id = nodes.length;
    nodes.push({id, parent, label: String(label), edge, cap, kids: []});
    if (parent != null) nodes[parent].kids.push(id);
    return id;
  };
  return {nodes, add};
}
const mkNotes = (L, list) => Object.fromEntries(list.map(([needle, text, nth]) => [L(needle, nth || 1), text]));
const mkTags = (L, list) => list.map(([name, c, needles, why]) => ({name, c, why,
  lines: needles.map(x => Array.isArray(x) ? L(x[0], x[1]) : L(x))}));

/* ================= 78. Subsets ================= */
const CODE_78 = `class Solution:
    def subsets(self, nums: List[int]) -> List[List[int]]:
        res = []
        subset = []

        def dfs(i):
            if i >= len(nums):
                res.append(subset.copy())
                return
            subset.append(nums[i])
            dfs(i + 1)
            subset.pop()
            dfs(i + 1)

        dfs(0)
        return res`;

function build78({nums}){
  const code = CODE_78, L = lineFinder(code), n = nums.length, total = 2 ** n;
  const T = makeTree();
  (function pre(parent, edge, i, sub){
    const id = T.add(parent, i < n ? nums[i] : '✓', edge, i < n ? '' : (sub.length ? sub.join(n >= 4 ? '' : ',') : '[ ]'));
    if (i < n){ pre(id, '+' + nums[i], i + 1, [...sub, nums[i]]); pre(id, 'skip', i + 1, sub); }
  })(null, '', 0, []);
  const res = [], subset = [], frames = [], fin = {};
  const S = recorder(() => {
    const top = frames[frames.length - 1];
    const vars = {nums};
    if (top) vars.i = top.i;
    vars.subset = subset; vars.res = res;
    return {vars, pointers: top && top.i < n ? {nums: {i: top.i}} : {},
      stack: ['subsets(nums)', ...frames.map(f => `dfs(i=${f.i})`)], viz: {stack: frames.map(f => f.id), fin, ret: {}}};
  });
  S(L('res = []'),'Setup','Make an empty res','`res = []`. Every finished subset will land here.','Hi, I’m Bit! First, an empty treasure chest called res. Every subset we find goes in here.');
  S(L('subset = []'),'Setup','Make an empty path','`subset = []`. This is the path we build as we walk the tree.','And this empty bag is subset. I’ll fill it and empty it as we explore.');
  S(L('=dfs(0)'),'Start','Start at the root',`Call \`dfs(0)\`: begin by deciding what to do with nums[0] = ${nums[0]}.`,`Here we go! Starting at the top of the tree with the number ${nums[0]}.`);
  function dfs(i, id){
    frames.push({i, id});
    S(L('def dfs'),'Enter',`Enter dfs(${i})`, i < n
      ? `A new frame goes on the call stack. Now deciding about nums[${i}] = ${nums[i]}. Path so far: \`${fmt(subset)}\`.`
      : `A new frame goes on the call stack with i = ${i}, one past the last index. Path so far: \`${fmt(subset)}\`.`,
      i < n ? `New call, dfs of ${i}! Time to decide about ${nums[i]}.` : `New call, dfs of ${i}. Hmm, no numbers left to look at!`);
    const base = i >= n;
    S(L('if i >= len'),'Check','Is this a leaf?', base ? 'Yes. Every number already has a take/skip decision, so this path is a complete subset.' : `No. nums[${i}] still needs a decision, so keep going.`,
      base ? 'Out of numbers? Yes! That means my bag is a finished subset.' : `Out of numbers? Nope, ${nums[i]} still needs deciding.`,
      `${i} >= ${n}  →  ${base ? 'True' : 'False'}`);
    if (base){
      res.push([...subset]); fin[id] = 'leaf';
      S(L('res.append'),'Collect',`Save ${fmt(subset)}`,`Leaf reached. A copy of \`${fmt(subset)}\` goes into res. That’s subset ${res.length} of ${total}.`,`Treasure! I save a copy of ${fmt(subset)}. That’s ${res.length} of ${total}!`);
      S(L('=return'),'Return','Back up one level',`This branch is finished. dfs(${i}) leaves the stack and control returns to dfs(${i - 1}).`,`This branch is done. Climbing back up to dfs of ${i - 1}.`);
      frames.pop(); return;
    }
    const [take, skip] = T.nodes[id].kids;
    subset.push(nums[i]);
    S(L('subset.append'),'Choose',`Take ${nums[i]}`,`Add nums[${i}] = ${nums[i]} to the path. subset is now \`${fmt(subset)}\`.`,`I’ll take the ${nums[i]}! My bag now holds ${fmt(subset)}.`);
    S(L('dfs(i + 1)', 1),'Explore',`Go deeper with ${nums[i]}`,`Call \`dfs(${i + 1})\` to decide the next number while ${nums[i]} is in the path. This is the left branch.`,`Down the left branch we go, keeping the ${nums[i]}.`);
    dfs(i + 1, take);
    subset.pop();
    S(L('subset.pop'),'Backtrack',`Undo ${nums[i]}`,`Back in dfs(${i}). Pop ${nums[i]} off the path so it returns to \`${fmt(subset)}\`, exactly how it was before we took it.`,`Rewind! I put the ${nums[i]} back. My bag is ${fmt(subset)} again.`);
    S(L('dfs(i + 1)', 2),'Explore',`Go deeper without ${nums[i]}`,`Call \`dfs(${i + 1})\` again, this time with ${nums[i]} left out. This is the right branch.`,`Now the right branch, where we skip the ${nums[i]}.`);
    dfs(i + 1, skip);
    fin[id] = 'done';
    S(L('dfs(i + 1)', 2),'Return',`dfs(${i}) is finished`,`Both branches below this node are explored. dfs(${i}) leaves the stack${i > 0 ? ` and control returns to dfs(${i - 1})` : ''}.`,`Both ways checked for ${nums[i]}. Heading back up!`);
    frames.pop();
  }
  dfs(0, 0);
  S(L('return res'),'Done','All subsets found',`Every branch has been explored. Return all ${res.length} subsets in res.`,`Mission complete! We found all ${res.length} subsets. High five!`);
  return {code, steps: S.steps, complexity:'O(n·2ⁿ) time, O(n) stack',
    subtitle:'Return every possible subset of nums. The classic take-or-skip backtracking tree.',
    varNotes:{subset:'the current path'}, goal:{var:'res', total, label:'collected'},
    lineNotes: mkNotes(L, [
      ['res = []','Creates the list that will collect every finished subset.'],
      ['subset = []','The path being built. One shared list that grows and shrinks as the search moves.'],
      ['def dfs','The recursive helper. `i` is the index of the number being decided right now.'],
      ['if i >= len','Base case: once `i` runs past the end, every number has a take/skip decision.'],
      ['res.append','Saves a snapshot of the path. `.copy()` matters because `subset` keeps changing afterwards.'],
      ['=return','Ends this branch and hands control back to the caller.'],
      ['subset.append','Choose: put `nums[i]` into the path.'],
      ['dfs(i + 1)','Explore the “take” branch with `nums[i]` included.',1],
      ['subset.pop','Un-choose: remove `nums[i]` so the path is exactly as it was before. This is the backtrack.'],
      ['dfs(i + 1)','Explore the “skip” branch with `nums[i]` left out. Also where the call finishes.',2],
      ['=dfs(0)','Starts the search at index 0, the root of the decision tree.'],
      ['return res','Every branch is finished, so all subsets are in `res`.']]),
    tags: mkTags(L, [
      ['Backtracking','--coral',['subset.append',['dfs(i + 1)',1],'subset.pop'],'choose (append), explore (dfs), un-choose (pop). The pop restores the path so the next branch starts clean.'],
      ['DFS','--cyan',[['dfs(i + 1)',1],['dfs(i + 1)',2],'=dfs(0)'],'each call goes all the way down one branch before trying the other, so the tree is explored depth first.'],
      ['Recursion','--violet',['def dfs','if i >= len','=return'],'dfs calls itself with `i + 1`, and the base case `i >= len(nums)` stops it.'],
      ['Take / skip','--mint',['subset.append',['dfs(i + 1)',1],['dfs(i + 1)',2]],'every number gets two branches, include it or leave it out. n numbers give 2ⁿ leaves.'],
      ['Power set','--pink',['res.append'],'each leaf saves one subset. All the leaves together are every possible subset.']]),
    visual:{type:'rtree', title:'Decision tree', aside:'left = take, right = skip', nodes:T.nodes,
      levels: Array.from({length: n + 1}, (_, d) => d < n ? `i=${d}` : 'leaf'),
      legend:[['on the call stack','--cyan'],['explored','--dim'],['subset saved','--pink']]}};
}

/* ================= 90. Subsets II ================= */
const CODE_90 = `class Solution:
    def subsetsWithDup(self, nums: List[int]) -> List[List[int]]:
        res = []
        nums.sort()

        def backtrack(i, subset):
            if i == len(nums):
                res.append(subset[::])
                return

            subset.append(nums[i])
            backtrack(i + 1, subset)
            subset.pop()

            while i + 1 < len(nums) and nums[i] == nums[i + 1]:
                i += 1
            backtrack(i + 1, subset)

        backtrack(0, [])
        return res`;

function build90({nums: input}){
  const code = CODE_90, L = lineFinder(code);
  const nums = [...input].sort((a, b) => a - b), n = nums.length;
  const T = makeTree();
  (function pre(parent, edge, i, sub){
    const id = T.add(parent, i < n ? nums[i] : '✓', edge, i < n ? '' : (sub.length ? sub.join(',') : '[ ]'));
    if (i < n){
      pre(id, '+' + nums[i], i + 1, [...sub, nums[i]]);
      let j = i; while (j + 1 < n && nums[j] === nums[j + 1]) j++;
      pre(id, j > i ? `skip ${nums[i]}s` : 'skip', j + 1, sub);
    }
  })(null, '', 0, []);
  const total = T.nodes.filter(x => !x.kids.length).length;
  let numsVar = [...input];
  const res = [], subset = [], frames = [], fin = {};
  const S = recorder(() => {
    const top = frames[frames.length - 1];
    const vars = {nums: numsVar};
    if (top) vars.i = top.i;
    vars.subset = subset; vars.res = res;
    return {vars, pointers: top && top.i < n ? {nums: {i: top.i}} : {},
      stack: ['subsetsWithDup(nums)', ...frames.map(f => `backtrack(i=${f.i0})`)], viz: {stack: frames.map(f => f.id), fin, ret: {}}};
  });
  S(L('res = []'),'Setup','Make an empty res','`res = []` will collect every unique subset.','Hi, I’m Bit! Empty treasure chest first. Only unique subsets allowed in here.');
  numsVar = nums;
  S(L('nums.sort()'),'Setup','Sort nums',`nums becomes \`${fmt(nums)}\`. Sorting puts equal numbers side by side, which is what makes skipping duplicates possible.`,'Line them up! Sorting puts twins next to each other so I can spot them.');
  S(L('backtrack(0, [])'),'Start','Start at the root','Call `backtrack(0, [])` with an empty subset.',`Off we go, starting with ${nums[0]}!`);
  function bt(i, id){
    const f = {i, i0: i, id}; frames.push(f);
    S(L('def backtrack'),'Enter',`Enter backtrack(${i})`, i < n
      ? `New frame. Deciding about nums[${i}] = ${nums[i]}. subset is \`${fmt(subset)}\`.`
      : `New frame with i = ${i}, past the last index. subset is \`${fmt(subset)}\`.`,
      i < n ? `New call! What do we do with this ${nums[i]}?` : 'New call, and no numbers left!');
    const base = i === n;
    S(L('if i == len(nums)'),'Check','Is this a leaf?', base ? 'Yes. Every number has been decided, so subset is complete.' : `No. nums[${i}] = ${nums[i]} still needs a decision.`,
      base ? 'Leaf! My bag is a finished subset.' : 'Not a leaf yet, keep deciding.', `${i} == ${n}  →  ${base ? 'True' : 'False'}`);
    if (base){
      res.push([...subset]); fin[id] = 'leaf';
      S(L('res.append'),'Collect',`Save ${fmt(subset)}`,`A copy of \`${fmt(subset)}\` goes into res (\`subset[::]\` makes the copy). That’s ${res.length} of ${total}.`,`Treasure! ${fmt(subset)} goes in the chest. ${res.length} of ${total}!`);
      S(L('=return'),'Return','Back up one level','This branch is done, so return to the caller.','Climbing back up!');
      frames.pop(); return;
    }
    const [take, skip] = T.nodes[id].kids;
    subset.push(nums[i]);
    S(L('subset.append'),'Choose',`Take ${nums[i]}`,`Add ${nums[i]} to subset, which is now \`${fmt(subset)}\`.`,`I’ll take the ${nums[i]}! Bag: ${fmt(subset)}.`);
    S(L('backtrack(i + 1, subset)', 1),'Explore',`Go deeper with ${nums[i]}`,`Call \`backtrack(${i + 1})\` for every subset that includes this ${nums[i]}.`,`Down the left branch, keeping the ${nums[i]}.`);
    bt(i + 1, take);
    subset.pop();
    S(L('subset.pop'),'Backtrack',`Undo ${nums[i]}`,`Back in backtrack(${f.i0}). Remove ${nums[i]}, so subset is \`${fmt(subset)}\` again.`,`Rewind! The ${nums[i]} goes back. Bag: ${fmt(subset)}.`);
    for (;;){
      const inRange = f.i + 1 < n, more = inRange && nums[f.i] === nums[f.i + 1];
      S(L('while i + 1'),'Check', more ? `Duplicate ${nums[f.i]} ahead` : 'No duplicate ahead',
        more ? `nums[${f.i + 1}] is also ${nums[f.i]}. Starting the skip branch there would rebuild subsets we already have, so move past it.`
             : inRange ? `nums[${f.i + 1}] = ${nums[f.i + 1]} is different, so the skip branch can start there.` : 'There is nothing after this index, so stop looking.',
        more ? `Another ${nums[f.i]}! Starting from it would make copycat subsets. Skip it.` : 'No twins ahead. Good to go.',
        inRange ? `${nums[f.i]} == ${nums[f.i + 1]}  →  ${more ? 'True' : 'False'}` : `${f.i + 1} < ${n}  →  False`);
      if (!more) break;
      f.i++;
      S(L('i += 1'),'Update','Skip the duplicate',`i moves to ${f.i}, past the repeated ${nums[f.i]}.`,`Hop over the extra ${nums[f.i]}.`);
    }
    const v = nums[f.i0], many = f.i > f.i0;
    S(L('backtrack(i + 1, subset)', 2),'Explore',`Go deeper without ${v}`, many ? `Call \`backtrack(${f.i + 1})\`: subsets with no ${v} at all.` : `Call \`backtrack(${f.i + 1})\`: subsets without this ${v}.`, `Now the right branch, with no ${v}${many ? 's' : ''}.`);
    bt(f.i + 1, skip);
    fin[id] = 'done';
    S(L('backtrack(i + 1, subset)', 2),'Return',`backtrack(${f.i0}) is finished`,'Both branches are explored, so this frame returns.','All done here, heading back up!');
    frames.pop();
  }
  bt(0, 0);
  S(L('return res'),'Done','All unique subsets found',`Return all ${res.length} subsets. No duplicates made it in.`,`Mission complete! ${res.length} unique subsets, zero copycats.`);
  const BT1 = ['backtrack(i + 1, subset)', 1], BT2 = ['backtrack(i + 1, subset)', 2];
  return {code, steps: S.steps, complexity:'O(n·2ⁿ) time, O(n) stack',
    subtitle:'Like Subsets, but nums can contain duplicates and the answer must not.',
    varNotes:{subset:'the current path'}, goal:{var:'res', total, label:'collected'},
    lineNotes: mkNotes(L, [
      ['res = []','Collects every unique subset.'],
      ['nums.sort()','Puts equal numbers next to each other so duplicates can be skipped.'],
      ['def backtrack','`i` is the index being decided; `subset` is the current path.'],
      ['if i == len(nums)','Base case: every number has been decided.'],
      ['res.append','Saves a copy of the path. `subset[::]` is a full slice, which copies the list.'],
      ['=return','Ends this branch.'],
      ['subset.append','Choose: include `nums[i]`.'],
      ['backtrack(i + 1, subset)','Explore every subset that includes `nums[i]`.',1],
      ['subset.pop','Un-choose: undo the append.'],
      ['while i + 1','Look ahead for copies of `nums[i]`.'],
      ['i += 1','Step past a copy, so the skip branch skips every copy.'],
      ['backtrack(i + 1, subset)','Explore subsets with no copy of this value at all. Also where the call finishes.',2],
      ['backtrack(0, [])','Starts the search with an empty path.'],
      ['return res','All unique subsets are in `res`.']]),
    tags: mkTags(L, [
      ['Backtracking','--coral',['subset.append',BT1,'subset.pop'],'choose (append), explore, un-choose (pop).'],
      ['Skip duplicates','--amber',['while i + 1','i += 1'],'after sorting, equal values sit together. The skip branch jumps past every copy so the same subset is never built twice.'],
      ['Sorting','--violet',['nums.sort()'],'sorting first is what makes duplicates adjacent and easy to skip.'],
      ['DFS','--cyan',[BT1,BT2,'backtrack(0, [])'],'each call explores one branch fully before the other.'],
      ['Power set','--pink',['res.append'],'each leaf saves one distinct subset.']]),
    visual:{type:'rtree', title:'Decision tree', aside:'left = take, right = skip', nodes:T.nodes,
      legend:[['on the call stack','--cyan'],['explored','--dim'],['subset saved','--pink']]}};
}

/* ================= 46. Permutations ================= */
const CODE_46 = `class Solution:
    def permute(self, nums: List[int]) -> List[List[int]]:
        res = []
        perm = []
        used = [False] * len(nums)

        def backtrack():
            if len(perm) == len(nums):
                res.append(perm.copy())
                return
            for j in range(len(nums)):
                if used[j]:
                    continue
                used[j] = True
                perm.append(nums[j])
                backtrack()
                perm.pop()
                used[j] = False

        backtrack()
        return res`;

function build46({nums}){
  const code = CODE_46, L = lineFinder(code), n = nums.length;
  const T = makeTree();
  (function pre(parent, label, edge, perm, used){
    const id = T.add(parent, label, edge, perm.length === n ? perm.join(',') : '');
    if (perm.length < n) nums.forEach((v, j) => { if (!used[j]){ const u = [...used]; u[j] = true; pre(id, v, '+' + v, [...perm, v], u); } });
  })(null, '∅', '', [], nums.map(() => false));
  let total = 1; for (let k = 2; k <= n; k++) total *= k;
  const res = [], perm = [], used = nums.map(() => false), frames = [], fin = {};
  let setup = 0;
  const S = recorder(() => {
    const top = frames[frames.length - 1];
    const vars = {nums};
    if (top && top.j != null) vars.j = top.j;
    if (setup >= 1) vars.res = res;
    if (setup >= 2) vars.perm = perm;
    if (setup >= 3) vars.used = used;
    return {vars, pointers: top && top.j != null ? {nums: {j: top.j}, used: {j: top.j}} : {},
      stack: ['permute(nums)', ...frames.map(f => `backtrack() perm=${fmt(f.entry)}`)], viz: {stack: frames.map(f => f.id), fin, ret: {}}};
  });
  setup = 1; S(L('res = []'),'Setup','Make an empty res','`res` will collect every ordering.','Hi, I’m Bit! Let’s line up these numbers every possible way.');
  setup = 2; S(L('perm = []'),'Setup','Make an empty ordering','`perm` is the ordering we’re building, one spot at a time.','This empty line is perm. We fill it spot by spot.');
  setup = 3; S(L('used = [False]'),'Setup','Nothing used yet',`\`used\` has one flag per number, all False.`,'And these flags remember who’s already in line.');
  S(L('backtrack()', 3),'Start','Start filling spot 1','Call `backtrack()` with an empty perm.','Here we go!');
  function bt(id){
    const f = {id, j: null, entry: [...perm]}; frames.push(f);
    S(L('def backtrack'),'Enter','Enter backtrack()',`New frame. perm is \`${fmt(perm)}\`, so we’re filling spot ${perm.length + 1} of ${n}.`, perm.length < n ? `New call! Who goes in spot ${perm.length + 1}?` : 'New call. Every spot is filled!');
    const base = perm.length === n;
    S(L('if len(perm)'),'Check','Is perm full?', base ? 'Yes, every spot is filled. This is a complete ordering.' : `No, ${plural(n - perm.length, 'spot')} left.`, base ? 'Full line! That’s a complete ordering.' : 'Not full yet.', `${perm.length} == ${n}  →  ${base ? 'True' : 'False'}`);
    if (base){
      res.push([...perm]); fin[id] = 'leaf';
      S(L('res.append'),'Collect',`Save ${fmt(perm)}`,`A copy of \`${fmt(perm)}\` goes into res. That’s ${res.length} of ${total}.`,`Saved ${fmt(perm)}! ${res.length} of ${total}.`);
      S(L('=return'),'Return','Back up one level','This ordering is done, so return.','Back up we go!');
      frames.pop(); return;
    }
    let kid = 0;
    for (let j = 0; j < n; j++){
      f.j = j;
      if (used[j]){
        S(L('continue'),'Check',`Skip ${nums[j]}`,`j = ${j}: ${nums[j]} is already in perm, so \`continue\` to the next j.`,`${nums[j]} is already in line. Next!`,`used[${j}]  →  True`);
        continue;
      }
      S(L('if used[j]'),'Check',`Try ${nums[j]}`,`j = ${j}: ${nums[j]} isn’t in perm yet, so it can take spot ${perm.length + 1}.`,`Is ${nums[j]} free? Yes!`,`used[${j}]  →  False`);
      used[j] = true;
      S(L('used[j] = True'),'Update',`Mark ${nums[j]} as used`,`\`used[${j}] = True\` so deeper calls won’t pick ${nums[j]} again.`,`Stamping ${nums[j]} as taken.`);
      perm.push(nums[j]);
      S(L('perm.append'),'Choose',`Place ${nums[j]}`,`perm is now \`${fmt(perm)}\`.`,`${nums[j]} joins the line. Now it’s ${fmt(perm)}.`);
      S(L('backtrack()', 2),'Explore','Fill the next spot', perm.length < n ? `Call \`backtrack()\` to fill spot ${perm.length + 1}.` : 'Call `backtrack()`. Every spot is filled now, so it will save this ordering.','Diving down to the next spot!');
      bt(T.nodes[id].kids[kid++]);
      perm.pop();
      S(L('perm.pop()'),'Backtrack',`Remove ${nums[j]}`,`Back in this call. Take ${nums[j]} off the end, so perm is \`${fmt(perm)}\` again.`,`Rewind! ${nums[j]} steps out of line.`);
      used[j] = false;
      S(L('used[j] = False'),'Update',`Free ${nums[j]}`,`\`used[${j}] = False\`, so ${nums[j]} can be placed again in other orderings.`,`${nums[j]} is free again.`);
    }
    f.j = null; fin[id] = 'done';
    S(L('for j in range'),'Return','Loop finished',`Every j has been tried for spot ${perm.length + 1}, so this call returns.`,'Tried everyone for this spot. Back up!');
    frames.pop();
  }
  bt(0);
  S(L('return res'),'Done','All orderings found',`Return all ${res.length} permutations.`,`Mission complete! ${res.length} different line-ups.`);
  return {code, steps: S.steps, complexity:'O(n·n!) time, O(n) stack',
    subtitle:'Return every ordering of distinct numbers. Each level of the tree fills one spot.',
    varNotes:{perm:'the ordering so far', used:'already placed?'}, goal:{var:'res', total, label:'collected'},
    lineNotes: mkNotes(L, [
      ['res = []','Collects every finished ordering.'],
      ['perm = []','The ordering being built, one spot at a time.'],
      ['used = [False]','Remembers which numbers are already in `perm`.'],
      ['def backtrack','Fills the next open spot in `perm`.'],
      ['if len(perm)','Base case: every spot is filled.'],
      ['res.append','Saves a copy, because `perm` keeps changing.'],
      ['=return','Ends this branch.'],
      ['for j in range','Try every number for the current spot. Also where the call finishes.'],
      ['if used[j]','Skip numbers that are already placed.'],
      ['continue','Jump to the next `j`.'],
      ['used[j] = True','Mark `nums[j]` as placed.'],
      ['perm.append','Choose: put `nums[j]` in the next spot.'],
      ['backtrack()','Fill the remaining spots.',2],
      ['perm.pop()','Un-choose: free the spot.'],
      ['used[j] = False','Unmark `nums[j]` so later orderings can use it.'],
      ['backtrack()','Start with an empty ordering.',3],
      ['return res','Every ordering is in `res`.']]),
    tags: mkTags(L, [
      ['Backtracking','--coral',['perm.append',['backtrack()',2],'perm.pop()'],'place a number, recurse, then remove it so the spot can hold the next candidate.'],
      ['Visited array','--amber',['used = [False]','if used[j]','used[j] = True','used[j] = False'],'the `used` list stops a number from appearing twice in one ordering.'],
      ['DFS','--cyan',[['backtrack()',2],['backtrack()',3]],'each ordering is completed before the next one is started.'],
      ['Permutation tree','--violet',['for j in range','res.append'],'the first spot has n choices, the next n − 1, and so on, so there are n! leaves.']]),
    visual:{type:'rtree', title:'Choice tree', aside:'each level fills one spot', nodes:T.nodes,
      levels: Array.from({length: n + 1}, (_, d) => d === 0 ? 'start' : `spot ${d}`),
      legend:[['on the call stack','--cyan'],['explored','--dim'],['ordering saved','--pink']]}};
}

/* ================= 1239. Max length concatenated ================= */
const CODE_1239 = `class Solution:
    def maxLength(self, arr: List[str]) -> int:
        chars = set()

        def backtrack(i):
            if i == len(arr):
                return len(chars)
            best = 0
            s = arr[i]
            if len(set(s)) == len(s) and not chars & set(s):
                chars.update(s)
                best = backtrack(i + 1)
                chars.difference_update(s)
            return max(best, backtrack(i + 1))

        return backtrack(0)`;

function build1239({arr}){
  const code = CODE_1239, L = lineFinder(code), n = arr.length;
  const short = s => s.length <= 3 ? s : s.slice(0, 2) + '…';
  const fits = (s, set) => new Set(s).size === s.length && ![...s].some(c => set.has(c));
  const T = makeTree();
  (function pre(parent, edge, i, chars, taken){
    if (i === n){ T.add(parent, '✓', edge, taken.join('') || '""'); return; }
    const s = arr[i];
    const id = T.add(parent, short(s), edge, '');
    if (fits(s, chars)) pre(id, '+' + s, i + 1, new Set([...chars, ...s]), [...taken, s]);
    else T.add(id, '✕', '+' + s, '');
    pre(id, 'skip', i + 1, chars, taken);
  })(null, '', 0, new Set(), []);
  const chars = new Set(), frames = [], fin = {}, ret = {};
  const setStr = () => chars.size ? '{' + [...chars].sort().join(', ') + '}' : 'set()';
  const S = recorder(() => {
    const top = frames[frames.length - 1];
    const vars = {arr};
    if (top){ vars.i = top.i; if (top.s != null) vars.s = top.s; if (top.best != null) vars.best = top.best; }
    vars.chars = [...chars].sort();
    return {vars, pointers: top && top.i < n ? {arr: {i: top.i}} : {},
      stack: ['maxLength(arr)', ...frames.map(f => `backtrack(i=${f.i})`)], viz: {stack: frames.map(f => f.id), fin, ret}};
  });
  S(L('chars = set()'),'Setup','Start with no letters','`chars` holds the letters of every string we’ve taken so far.','Hi, I’m Bit! My letter bag starts empty. No letter may ever appear twice!');
  S(L('return backtrack(0)'),'Start','Start at the first string',`Call \`backtrack(0)\` to decide about "${arr[0]}".`,`Let’s start with "${arr[0]}".`);
  function bt(i, id){
    const f = {i, id, s: null, best: null}; frames.push(f);
    S(L('def backtrack'),'Enter',`Enter backtrack(${i})`, i < n ? `New frame. Deciding whether to take arr[${i}] = "${arr[i]}". chars is \`${setStr()}\`.` : `New frame with i = ${i}: every string has been decided.`, i < n ? `New call! Take "${arr[i]}" or skip it?` : 'New call, and no strings left!');
    const base = i === n;
    S(L('if i == len(arr)'),'Check','Is this a leaf?', base ? 'Yes. Every string has been taken or skipped.' : `No. "${arr[i]}" still needs a decision.`, base ? 'All strings decided!' : 'Still deciding.', `${i} == ${n}  →  ${base ? 'True' : 'False'}`);
    if (base){
      const len = chars.size; ret[id] = len; fin[id] = 'leaf';
      S(L('return len(chars)'),'Collect',`Return ${len}`, len ? `The letters taken, \`${setStr()}\`, are all unique, so this combination has length ${len}.` : 'Nothing was taken on this path, so its length is 0.', `End of the line! This combo scores ${len}.`);
      frames.pop(); return len;
    }
    const [take, skip] = T.nodes[id].kids;
    f.best = 0;
    S(L('best = 0'),'Setup','best starts at 0','`best` will hold the longest result from taking arr[i]. It stays 0 if we can’t take it.','Starting score: zero.');
    const s = arr[i]; f.s = s;
    S(L('s = arr[i]'),'Update',`Look at "${s}"`,`s = "${s}".`,`Next up: "${s}".`);
    const selfDup = new Set(s).size !== s.length, clash = [...new Set(s)].filter(c => chars.has(c)), ok = !selfDup && !clash.length;
    if (!ok) fin[take] = 'pruned';
    S(L('if len(set(s))'),'Check', ok ? `"${s}" fits` : `"${s}" doesn’t fit`,
      ok ? `"${s}" has no repeated letters and shares none with chars, so we can take it.`
         : selfDup ? `"${s}" repeats a letter by itself, so it can never be taken. That branch is pruned.` : `"${s}" shares ${clash.map(c => `"${c}"`).join(', ')} with chars. Taking it would repeat letters, so that branch is pruned.`,
      ok ? `"${s}" fits perfectly. Let’s try taking it!` : `Uh-oh, "${s}" would repeat ${selfDup ? 'a letter' : clash.join(' and ')}. Not allowed!`,
      ok ? 'no repeats and no overlap  →  True' : selfDup ? `len(set("${s}")) == len("${s}")  →  False` : `chars & set("${s}") = {${clash.join(', ')}}  →  False`);
    if (ok){
      [...s].forEach(c => chars.add(c));
      S(L('chars.update(s)'),'Choose',`Take "${s}"`,`Add its letters. chars is now \`${setStr()}\`.`,`Taking "${s}"! My bag: ${[...chars].sort().join(', ')}.`);
      S(L('best = backtrack(i + 1)'),'Explore',`Go deeper with "${s}"`,`Call \`backtrack(${i + 1})\` to see how long the string gets with "${s}" included.`,`Down the take branch with "${s}".`);
      const r = bt(i + 1, take); f.best = r;
      S(L('best = backtrack(i + 1)'),'Update',`best = ${r}`,`The take branch came back with ${r}, so best = ${r}.`,`The take branch scored ${r}!`);
      [...s].forEach(c => chars.delete(c));
      S(L('chars.difference_update(s)'),'Backtrack',`Remove "${s}"`,`Take its letters back out. chars is \`${setStr()}\` again.`,`Rewind! "${s}" leaves the bag.`);
    }
    S(L('return max(best'),'Explore',`Go deeper without "${s}"`,`Call \`backtrack(${i + 1})\` for the skip branch.`,`Now the skip branch, without "${s}".`);
    const r2 = bt(i + 1, skip), m = Math.max(f.best, r2);
    ret[id] = m; fin[id] = 'done';
    S(L('return max(best'),'Return',`Return ${m}`,`Take gave ${f.best}, skip gave ${r2}. Return the larger, ${m}.`,`Take scored ${f.best}, skip scored ${r2}. I keep the ${m}!`, `max(${f.best}, ${r2})  →  ${m}`);
    frames.pop(); return m;
  }
  const ans = bt(0, 0);
  S(L('return backtrack(0)'),'Done',`Answer: ${ans}`,`The longest concatenation with all-unique letters has length ${ans}.`,`Mission complete! The best we can do is ${ans} letters.`);
  return {code, steps: S.steps, complexity:'O(2ⁿ·m) time, O(n) stack',
    subtitle:'Pick strings so every letter is unique; return the longest total length.',
    varNotes:{chars:'letters taken so far'},
    lineNotes: mkNotes(L, [
      ['chars = set()','Letters used by the strings currently taken.'],
      ['def backtrack','Takes or skips `arr[i]` and returns the longest length reachable from here.'],
      ['if i == len(arr)','Base case: every string decided.'],
      ['return len(chars)','A finished path scores the number of letters it used.'],
      ['best = 0','Best length if we take `arr[i]`. Stays 0 if we can’t.'],
      ['s = arr[i]','The string being decided.'],
      ['if len(set(s))','Can we take `s`? It needs no repeated letters and no overlap with `chars`.'],
      ['chars.update(s)','Choose: add the letters of `s`.'],
      ['best = backtrack(i + 1)','Explore the take branch.'],
      ['chars.difference_update(s)','Un-choose: remove the letters of `s`.'],
      ['return max(best','Explore the skip branch, then return the larger answer.'],
      ['return backtrack(0)','Start with nothing taken.']]),
    tags: mkTags(L, [
      ['Backtracking','--coral',['chars.update(s)','best = backtrack(i + 1)','chars.difference_update(s)'],'add letters, recurse, then remove them before trying the skip branch.'],
      ['Pruning','--amber',['if len(set(s))'],'a string that clashes is never taken, so that whole branch is cut off early.'],
      ['Hash set','--violet',['chars = set()','if len(set(s))'],'a set makes “is this letter used?” an O(1) check.'],
      ['Take / skip','--mint',['best = backtrack(i + 1)','return max(best'],'each string is either taken or skipped, and the better result wins.']]),
    visual:{type:'rtree', title:'Decision tree', aside:'left = take, right = skip, =n is what a call returns', nodes:T.nodes,
      levels: Array.from({length: n + 1}, (_, d) => d < n ? `i=${d}` : 'leaf'),
      legend:[['on the call stack','--cyan'],['explored','--dim'],['complete path','--pink'],['pruned','--coral']]}};
}

/* ================= 200. Number of Islands ================= */
const CODE_200 = `class Solution:
    def numIslands(self, grid: List[List[str]]) -> int:
        ROWS, COLS = len(grid), len(grid[0])
        islands = 0

        def dfs(r, c):
            if r < 0 or c < 0 or r >= ROWS or c >= COLS or grid[r][c] != "1":
                return
            grid[r][c] = "0"
            dfs(r + 1, c)
            dfs(r - 1, c)
            dfs(r, c + 1)
            dfs(r, c - 1)

        for r in range(ROWS):
            for c in range(COLS):
                if grid[r][c] == "1":
                    dfs(r, c)
                    islands += 1
        return islands`;

function build200({grid}){
  const code = CODE_200, L = lineFinder(code);
  const g = clone(grid), R = g.length, C = g[0].length, isl = g.map(r => r.map(() => 0));
  let islands = 0, scan = null, probe = null;
  const frames = [];
  const S = recorder(() => {
    const top = frames[frames.length - 1];
    const vars = {ROWS: R, COLS: C, islands};
    if (top){ vars.r = top.r; vars.c = top.c; } else if (scan){ vars.r = scan[0]; vars.c = scan[1]; }
    return {vars, pointers: {}, stack: ['numIslands(grid)', ...frames.map(f => `dfs(${f.r}, ${f.c})`)],
      viz: {cells: g, tint: isl, cur: top ? [top.r, top.c] : null, path: frames.slice(0, -1).map(f => [f.r, f.c]), scan, probe}};
  });
  S(L('ROWS, COLS'),'Setup','Measure the grid',`The grid has ${R} rows and ${C} columns.`,`Hi, I’m Bit! Let’s explore this ${R} by ${C} map.`);
  S(L('islands = 0'),'Setup','No islands yet','`islands` counts separate islands.','Island counter: zero.');
  const DIRS = [['dfs(r + 1, c)',1,0,'down'],['dfs(r - 1, c)',-1,0,'up'],['dfs(r, c + 1)',0,1,'right'],['dfs(r, c - 1)',0,-1,'left']];
  function dfs(r, c){
    frames.push({r, c});
    const oob = r < 0 || c < 0 || r >= R || c >= C;
    if (oob || g[r][c] !== '1'){
      const why = r < 0 ? `r < 0` : c < 0 ? `c < 0` : r >= R ? `r >= ROWS` : c >= C ? `c >= COLS` : `grid[${r}][${c}] != "1"`;
      probe = [r, c];
      S(L('if r < 0'),'Check',`dfs(${r}, ${c}): stop`,
        oob ? `(${r}, ${c}) is outside the grid, so this call returns right away.` : isl[r][c] ? `(${r}, ${c}) was already sunk, so this call returns right away.` : `(${r}, ${c}) is water, so this call returns right away.`,
        oob ? 'Whoa, that’s off the map! Turning back.' : isl[r][c] ? 'Been here already!' : 'Splash, water! Turning back.', `${why}  →  True`);
      probe = null; frames.pop(); return;
    }
    S(L('if r < 0'),'Check',`dfs(${r}, ${c}): land`,`(${r}, ${c}) is inside the grid and is "1", so keep going.`,`(${r}, ${c}) is solid land!`,'out of bounds or not "1"  →  False');
    g[r][c] = '0'; isl[r][c] = islands + 1;
    S(L('grid[r][c] = "0"'),'Update',`Sink (${r}, ${c})`,`Set grid[${r}][${c}] = "0" so this cell is never visited or counted again.`,`Sinking (${r}, ${c}) so we never count it twice.`);
    for (const [needle, dr, dc, name] of DIRS){
      S(L(needle),'Explore',`Look ${name}`,`Call \`dfs(${r + dr}, ${c + dc})\`, the cell ${name} of (${r}, ${c}).`,`Peeking ${name}...`);
      dfs(r + dr, c + dc);
    }
    S(L('dfs(r, c - 1)'),'Return',`dfs(${r}, ${c}) is finished`,'All four neighbors are checked, so return to the caller.','All four directions done. Back we go!');
    frames.pop();
  }
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++){
    scan = [r, c];
    const land = g[r][c] === '1';
    S(L('if grid[r][c] == "1"'),'Loop', land ? `New land at (${r}, ${c})` : `Scan (${r}, ${c})`,
      land ? `grid[${r}][${c}] is "1" and hasn’t been sunk, so it belongs to a new island.` : isl[r][c] ? `grid[${r}][${c}] is "0" now, because we sank it as part of island ${isl[r][c]}.` : `grid[${r}][${c}] is "0", water.`,
      land ? 'Land ho! A brand new island!' : isl[r][c] ? 'Already sunk. Moving on.' : 'Just water. Next!', `grid[${r}][${c}] == "1"  →  ${land ? 'True' : 'False'}`);
    if (land){
      S(L('=dfs(r, c)'),'Explore',`Sink island ${islands + 1}`,`Call \`dfs(${r}, ${c})\` to visit every land cell connected to this one and sink it.`,'Let’s explore the whole island and sink it as we go!');
      dfs(r, c);
      islands++;
      S(L('islands += 1'),'Collect',`islands = ${islands}`,`That whole island is sunk, so count it. islands = ${islands}.`,`Island number ${islands}, done!`);
    }
  }
  scan = null;
  S(L('return islands'),'Done',`${plural(islands, 'island')}`,`Every cell has been scanned. Return ${islands}.`,`Mission complete! I counted ${plural(islands, 'island')}.`);
  return {code, steps: S.steps, complexity:'O(rows·cols) time and space',
    subtitle:'Count groups of connected "1" cells (up, down, left, right).',
    lineNotes: mkNotes(L, [
      ['ROWS, COLS','Grid size, used for bounds checks.'],
      ['islands = 0','How many islands found so far.'],
      ['def dfs','Sinks every land cell connected to (r, c).'],
      ['if r < 0','Stop at the grid’s edge, at water, or at land already sunk.'],
      ['grid[r][c] = "0"','Sink the cell so it’s never visited or counted again.'],
      ['dfs(r + 1, c)','Explore the cell below.'],
      ['dfs(r - 1, c)','Explore the cell above.'],
      ['dfs(r, c + 1)','Explore the cell to the right.'],
      ['dfs(r, c - 1)','Explore the cell to the left. Also where the call finishes.'],
      ['if grid[r][c] == "1"','Unsunk land means we found a new island.'],
      ['=dfs(r, c)','Sink the whole island.'],
      ['islands += 1','Count it.'],
      ['return islands','The number of islands.']]),
    tags: mkTags(L, [
      ['DFS','--cyan',['def dfs','dfs(r + 1, c)','dfs(r - 1, c)','dfs(r, c + 1)','dfs(r, c - 1)'],'each call dives into a neighbor before trying the next direction.'],
      ['Flood fill','--mint',['grid[r][c] = "0"','=dfs(r, c)'],'one call spreads over a whole connected region, marking it as it goes.'],
      ['Grid traversal','--violet',['for r in range','for c in range','if r < 0'],'the outer loops visit every cell; the bounds check keeps DFS inside the grid.'],

    visual:{type:'grid', mode:'islands', rows:R, cols:C, title:'Grid', aside:'(row, column)',

const CODE_994 = `class Solution:
    def orangesRotting(self, grid: List[List[int]]) -> int:

        minutes = 0
        dirs = [(1, 0), (-1, 0), (0, 1), (0, -1)]
        while q and fresh > 0:
            for _ in range(len(q)):
                r, c = q.popleft()
                for dr, dc in dirs:
                    nr, nc = r + dr, c + dc
                    if 0 <= nr < ROWS and 0 <= nc < COLS and grid[nr][nc] == 1:
                        grid[nr][nc] = 2
                        fresh -= 1
                        q.append((nr, nc))

  S(L('q = deque()'),'Setup','Make an empty queue','The queue will hold rotten oranges whose neighbors haven’t been infected yet.','This queue lines up the rotten ones.');
  S(L('fresh = 0'),'Setup','Count fresh oranges','`fresh` counts oranges that haven’t rotted.','Let’s count the fresh ones.');

  }

  S(L('dirs ='),'Setup','Four directions','`dirs` lists the four neighbors: down, up, right, left.','Rot spreads up, down, left and right. Never diagonally!');
  const DIRS = [[1,0,'below'],[-1,0,'above'],[0,1,'right of'],[0,-1,'left of']];

/* ================= 207. Course Schedule ================= */
const CODE_207 = `class Solution:
    def canFinish(self, numCourses: int, prerequisites: List[List[int]]) -> bool:
        graph = [[] for _ in range(numCourses)]
        indegree = [0] * numCourses
        for course, pre in prerequisites:
            graph[pre].append(course)
            indegree[course] += 1

        q = deque(c for c in range(numCourses) if indegree[c] == 0)
        taken = 0
        while q:
            cur = q.popleft()
            taken += 1
            for nxt in graph[cur]:
                indegree[nxt] -= 1
                if indegree[nxt] == 0:
                    q.append(nxt)
        return taken == numCourses`;

    const vars = {};

    if (cur !== null) vars.cur = cur;

  phase = 1; S(L('graph = [[]'),'Setup','Empty adjacency list',`One empty list per course, ${n} in all. graph[a] will list the courses that a unlocks.`,'Hi, I’m Bit! Let’s map which classes unlock which.');
  phase = 2; S(L('indegree = [0]'),'Setup','Zero prerequisites so far','`indegree[c]` counts the unmet prerequisites of course c.','Every course starts with zero locks.');
  for (const [course, pre] of pr){
    graph[pre].push(course); built++; hot = [pre, course];
    S(L('graph[pre].append(course)'),'Update',`Edge ${pre} → ${course}`,`Course ${course} needs ${pre} first, so add an arrow from ${pre} to ${course}.`,`${pre} unlocks ${course}. Drawing an arrow!`);
    indeg[course]++;

  }

  for (;;){

    if (!go) break;

      ['q = deque(','Courses with no prerequisites can start immediately.'], ['taken = 0','Courses completed.'], ['while q','Keep going while something is ready.'],
      ['cur = q.popleft()','Take a ready course.'], ['taken += 1','Count it.'], ['for nxt in graph[cur]','Visit every course that depended on it.'],
      ['indegree[nxt] -= 1','One prerequisite met.'], ['if indegree[nxt] == 0','All prerequisites met?'], ['q.append(nxt)','Ready to take.'],
      ['return taken == numCourses','If a cycle exists, some courses are never taken.']]),
    tags: mkTags(L, [
      ['Topological sort','--violet',['q = deque(','cur = q.popleft()','q.append(nxt)'],'Kahn’s algorithm takes courses in an order that respects every prerequisite.'],
      ['Indegree','--amber',['indegree = [0]','indegree[course] += 1','indegree[nxt] -= 1','if indegree[nxt] == 0'],'a course is ready when its count of unmet prerequisites reaches 0.'],
      ['Adjacency list','--mint',['graph = [[]','graph[pre].append(course)'],'each course lists the courses it unlocks.'],
      ['BFS','--cyan',['while q','cur = q.popleft()'],'ready courses are processed from a queue.'],

    S(L('lastEnd ='),'Update',`lastEnd = ${lastEnd}`,`The last interval in output ends at ${lastEnd}.`,`The last block ends at ${lastEnd}.`);
    const overlap = start <= lastEnd;

/* ================= 57. Insert Interval ================= */
const CODE_57 = `class Solution:
    def insert(self, intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
        n = len(intervals)
        i = 0
        res = []

        while i < n and intervals[i][1] < newInterval[0]:
            res.append(intervals[i])
            i += 1

        while i < n and newInterval[1] >= intervals[i][0]:
            newInterval[0] = min(newInterval[0], intervals[i][0])
            newInterval[1] = max(newInterval[1], intervals[i][1])
            i += 1
        res.append(newInterval)

        while i < n:
            res.append(intervals[i])
            i += 1

        return res`;

function build57({intervals: input, newInterval: nin}){
  const code = CODE_57, L = lineFinder(code);
  const intervals = input.map(x => [...x]), rows = clone(intervals), n = intervals.length, newInterval = [...nin];
  let i = null, res = null, cur = null, newGroup = null, mark = null, markLabel = '', hasN = false;
  const group = {};
  const S = recorder(() => {
    const vars = {intervals, newInterval};
    if (hasN) vars.n = n;
    if (i !== null) vars.i = i;
    if (res) vars.res = res;
    return {vars, pointers: {}, stack: ['insert(intervals, newInterval)'],
      viz: {cur, group, out: res || [], newIv: newInterval, newGroup, lastEnd: mark, markLabel}};
  });
  const iv = k => intervals[k], F = a => `[${a[0]}, ${a[1]}]`;
  hasN = true;
  S(L('n = len(intervals)'),'Setup','Count the intervals',`n = ${n}. The existing intervals are sorted and don’t overlap each other.`,'Hi, I’m Bit! The old intervals are already in order. We just need to slot the new one in.');
  i = 0;
  S(L('i = 0'),'Setup','Start at the left','`i` walks through intervals from left to right.','Starting from the left.');
  res = [];
  S(L('res = []'),'Setup','Make an empty result','`res` will hold the final list of intervals.','Empty result list, ready to fill.');

  mark = newInterval[0]; markLabel = 'new start';
  for (;;){
    cur = i < n ? i : null;
    const ok = i < n && iv(i)[1] < newInterval[0];
    S(L('while i < n and intervals[i][1] < newInterval[0]'),'Compare',
      i >= n ? 'No intervals left' : ok ? `${F(iv(i))} ends before ${newInterval[0]}` : `${F(iv(i))} reaches ${newInterval[0]}`,
      i >= n ? 'Every interval ended before newInterval, so phase 1 is over.' : ok ? `It ends at ${iv(i)[1]}, before newInterval starts at ${newInterval[0]}, so they can’t overlap. It goes straight into res.` : `It ends at ${iv(i)[1]}, which is not before ${newInterval[0]}. Phase 1 is over: from here, intervals may overlap newInterval.`,
      i >= n ? 'Nothing left to check!' : ok ? `${F(iv(i))} is totally to the left. Safe!` : `${F(iv(i))} reaches the new one. Phase one is done.`,
      i >= n ? `${i} < ${n}  →  False` : `${iv(i)[1]} < ${newInterval[0]}  →  ${ok ? 'True' : 'False'}`);
    if (!ok) break;
    res.push(iv(i)); group[i] = res.length - 1;
    S(L('res.append(intervals[i])', 1),'Collect',`Keep ${F(iv(i))}`,'Copy it into res unchanged.',`${F(iv(i))} goes in as is.`);
    i++;
    S(L('i += 1', 1),'Update',`i = ${i}`,'Move to the next interval.','Next!');
  }

  mark = newInterval[1]; markLabel = 'new end';
  for (;;){
    cur = i < n ? i : null;
    const ok = i < n && newInterval[1] >= iv(i)[0];
    S(L('while i < n and newInterval[1] >= intervals[i][0]'),'Compare',
      i >= n ? 'No intervals left' : ok ? `${F(iv(i))} overlaps` : `${F(iv(i))} starts after`,
      i >= n ? 'There are no more intervals to merge.' : ok ? `newInterval ends at ${newInterval[1]}, at or after ${F(iv(i))} starts at ${iv(i)[0]}, so they overlap and must be merged.` : `newInterval ends at ${newInterval[1]}, before ${F(iv(i))} starts at ${iv(i)[0]}. No more overlaps.`,
      i >= n ? 'Nothing left to merge.' : ok ? `Bump! ${F(iv(i))} overlaps the new interval. Merge time!` : 'Clear gap ahead. Merging is done.',
      i >= n ? `${i} < ${n}  →  False` : `${newInterval[1]} >= ${iv(i)[0]}  →  ${ok ? 'True' : 'False'}`);
    if (!ok) break;
    group[i] = res.length;
    const o0 = newInterval[0];
    newInterval[0] = Math.min(o0, iv(i)[0]);
    S(L('newInterval[0] = min'),'Update',`newInterval[0] = ${newInterval[0]}`,`The merged start is min(${o0}, ${iv(i)[0]}) = ${newInterval[0]}.`, newInterval[0] < o0 ? `Stretch the start back to ${newInterval[0]}.` : `Start stays at ${newInterval[0]}.`,`min(${o0}, ${iv(i)[0]})  →  ${newInterval[0]}`);
    const o1 = newInterval[1];
    newInterval[1] = Math.max(o1, iv(i)[1]); mark = newInterval[1];
    S(L('newInterval[1] = max'),'Update',`newInterval[1] = ${newInterval[1]}`,`The merged end is max(${o1}, ${iv(i)[1]}) = ${newInterval[1]}. newInterval is now \`${fmt(newInterval)}\`.`, newInterval[1] > o1 ? `Stretch the end out to ${newInterval[1]}!` : `End stays at ${newInterval[1]}.`,`max(${o1}, ${iv(i)[1]})  →  ${newInterval[1]}`);
    i++;
    S(L('i += 1', 2),'Update',`i = ${i}`,'This interval is swallowed by newInterval. Move on.','Gobbled up. Next!');
  }
  cur = null; mark = null;
  res.push(newInterval); newGroup = res.length - 1;
  S(L('res.append(newInterval)'),'Collect',`Insert ${F(newInterval)}`,`Add the merged newInterval, \`${fmt(newInterval)}\`, to res.`,`In goes ${F(newInterval)}!`);

  for (;;){
    cur = i < n ? i : null;
    const ok = i < n;
    S(L('=while i < n:'),'Check', ok ? `${F(iv(i))} is after` : 'All intervals placed', ok ? `${F(iv(i))} starts after newInterval ends, so it goes in unchanged.` : 'Every interval has been placed.', ok ? `${F(iv(i))} is safely to the right.` : 'Everyone has a spot!', `${i} < ${n}  →  ${ok ? 'True' : 'False'}`);
    if (!ok) break;
    res.push(iv(i)); group[i] = res.length - 1;
    S(L('res.append(intervals[i])', 2),'Collect',`Keep ${F(iv(i))}`,'Copy it into res unchanged.',`${F(iv(i))} goes in as is.`);
    i++;
    S(L('i += 1', 3),'Update',`i = ${i}`,'Move to the next interval.','Next!');
  }
  cur = null;
  S(L('return res'),'Done',`${plural(res.length, 'interval')}`,`Return \`${JSON.stringify(res).replace(/,\[/g, ', [')}\`.`,`Mission complete! ${plural(res.length, 'interval')}, still sorted, no overlaps.`);
  return {code, steps: S.steps, complexity:'O(n) time, O(n) space',
    subtitle:'Insert newInterval into sorted, non-overlapping intervals, merging where needed.',
    lineNotes: mkNotes(L, [
      ['n = len(intervals)','Number of existing intervals.'], ['i = 0','Index into intervals.'], ['res = []','The answer being built.'],
      ['while i < n and intervals[i][1] < newInterval[0]','Phase 1: intervals that end before newInterval starts.'],
      ['res.append(intervals[i])','Copy a non-overlapping interval as is.',1], ['i += 1','Advance.',1],
      ['while i < n and newInterval[1] >= intervals[i][0]','Phase 2: intervals that overlap newInterval.'],
      ['newInterval[0] = min','Grow newInterval to the left if needed.'], ['newInterval[1] = max','Grow newInterval to the right if needed.'], ['i += 1','Advance.',2],
      ['res.append(newInterval)','Insert the merged interval.'],
      ['=while i < n:','Phase 3: everything left starts after newInterval.'], ['res.append(intervals[i])','Copy a non-overlapping interval as is.',2], ['i += 1','Advance.',3],
      ['return res','Sorted, with no overlaps.']]),
    tags: mkTags(L, [
      ['Intervals','--cyan',['while i < n and newInterval[1] >= intervals[i][0]'],'two intervals overlap when one starts at or before the other ends.'],
      ['Three phases','--violet',['while i < n and intervals[i][1] < newInterval[0]','while i < n and newInterval[1] >= intervals[i][0]','=while i < n:'],'before newInterval, overlapping it, and after it. One pass, no sorting needed.'],
      ['Merging','--mint',['newInterval[0] = min','newInterval[1] = max'],'overlapping intervals collapse into one by taking the smallest start and largest end.'],
      ['Linear scan','--amber',['i = 0','=while i < n:'],'`i` only moves forward, so the whole thing is O(n).']]),
    visual:{type:'intervals', rows, newRow: [...nin], title:'Timeline', aside:'input on top, newInterval in pink, output below',
      legend:[['current interval','--ph'],['newInterval','--pink'],['same color = same output block','--mint'],['marker','--amber']]}};
}

const pyJSON = s => JSON.parse(s.trim().replace(/\bNone\b/g, 'null').replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false').replace(/'/g, '"'));
const rhs = s => s.includes('=') ? s.slice(s.indexOf('=') + 1) : s;
const fail = m => { throw new Error(m); };
function asJSON(text, hint){ try { return pyJSON(rhs(text)); } catch { fail(`Couldn’t read that. Use this format: ${hint}`); } }

function parseTree(arr){
  const nodes = [{id: 0, val: arr[0], left: null, right: null}], q = [0]; let i = 1;
  while (q.length && i < arr.length){
    const p = q.shift();
    for (const side of ['left', 'right']){
      if (i < arr.length && arr[i] != null){ const id = nodes.length; nodes.push({id, val: arr[i], left: null, right: null}); nodes[p][side] = id; q.push(id); }
      i++;
    }
  }
  return nodes;
}

const rich = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

const TAG_COLORS = ['--coral','--cyan','--violet','--mint','--pink','--amber'];

const KW = new Set(('def class return if elif else for while in not and or is None True False import from as with try except finally raise lambda yield pass break continue global nonlocal ' +
  'function const let var new this public private protected static final void int long boolean char double float null true false switch case default do typeof of instanceof auto struct template typename using namespace include std vector unordered_map map set fn mut impl match func').split(' '));
function hl(line){
  const re = /(#.*$|\/\/.*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)(\s*\()?/g;
  let out = '', last = 0, m;
  while ((m = re.exec(line))){
    out += esc(line.slice(last, m.index));
    if (m[1]) out += `<span class="t-s">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-n">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="t-n">${m[3]}</span>`;
    else if (m[4]){
      const w = m[4];
      if (KW.has(w)) out += `<span class="t-k">${w}</span>`;
      else if (m[5]) out += `<span class="t-f">${w}</span>`;
      else if (/^[A-Z]/.test(w)) out += `<span class="t-c">${w}</span>`;
      else out += esc(w);
      if (m[5]) out += esc(m[5]);
    }
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}

VIZ.grid = {
  build(v, box){
    const wrap = document.createElement('div'); wrap.className = 'gv';
    wrap.style.gridTemplateColumns = `20px repeat(${v.cols}, minmax(30px, 56px))`;
    const cell = (cls, txt) => { const d = document.createElement('div'); d.className = cls; d.textContent = txt; wrap.appendChild(d); return d; };
    cell('gh', '');
    for (let c = 0; c < v.cols; c++) cell('gh', c);
    this.cells = [];
    for (let r = 0; r < v.rows; r++){
      cell('gh', r); this.cells.push([]);
      for (let c = 0; c < v.cols; c++) this.cells[r].push(cell('gcell', ''));
    }
    this.mode = v.mode; box.appendChild(wrap);
  },
  render(s){
    const z = s.viz, key = a => a ? a[0] + ',' + a[1] : '#';
    const path = new Set((z.path || []).map(key)), inq = new Set((z.inq || []).map(key));
    this.cells.forEach((row, r) => row.forEach((d, c) => {
      const v = z.cells[r][c], cl = ['gcell'], k = r + ',' + c; let html = '';

        const t = z.tint[r][c];

VIZ.bintree = {
  build(v, box){
    const nodes = v.nodes, pos = {}; let idx = 0, maxD = 0;
    (function walk(id, d){ if (id == null) return; maxD = Math.max(maxD, d); walk(nodes[id].left, d + 1); pos[id] = {x: idx++, d}; walk(nodes[id].right, d + 1); })(0, 0);
    const W = 680, left = 64, right = 16, rowH = 70, top = 28, gap = (W - left - right) / idx, H = top + maxD * rowH + 30, r = 18;
    const X = x => left + (x + .5) * gap, Y = d => top + d * rowH;
    const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Binary tree'});
    for (let d = 0; d <= maxD; d++) svg.appendChild(sv('text', {class: 'depth', x: 2, y: Y(d) + 4}, `level ${d}`));
    const gE = sv('g'), gN = sv('g'); svg.append(gE, gN);
    this.refs = [];
    nodes.forEach(nd => {
      const p = pos[nd.id];
      for (const ch of [nd.left, nd.right]) if (ch != null){ const q = pos[ch]; gE.appendChild(sv('line', {class: 'edge seen', x1: X(p.x), y1: Y(p.d), x2: X(q.x), y2: Y(q.d)})); }
      const g = sv('g', {class: 'node'});
      g.append(sv('circle', {class: 'halo', cx: X(p.x), cy: Y(p.d), r}), sv('circle', {cx: X(p.x), cy: Y(p.d), r}), sv('text', {x: X(p.x), y: Y(p.d)}, nd.val));
      gN.appendChild(g); this.refs.push({id: nd.id, g});
    });
    box.appendChild(svg);
  },
  render(s){
    const z = s.viz, inq = new Set(z.q);
    this.refs.forEach(({id, g}) => {
      let cls = 'node';
      if (id === z.cur) cls += ' active';
      else if (inq.has(id)) cls += ' inq';
      else if (z.done[id] !== undefined){ cls += ' lvl'; g.style.setProperty('--tc', `var(${PALETTE[z.done[id] % PALETTE.length]})`); }
      g.setAttribute('class', cls);
    });
  }
};

VIZ.intervals = {
  build(v, box){
    const rows = v.rows, all = v.newRow ? [...rows, v.newRow] : rows, m = all.length, lo = 0, hi = Math.max(...all.map(x => x[1])) + 1;
    const W = 680, left = 66, right = 20, rowH = 28, top = 10, outY = top + m * rowH + 22, axisY = outY + 34, H = axisY + 24;

    const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Interval timeline'});
    const step = hi - lo > 24 ? 5 : hi - lo > 12 ? 2 : 1;
    for (let t = lo; t <= hi; t += step){ svg.appendChild(sv('line', {class: 'axis', x1: X(t), y1: top - 4, x2: X(t), y2: axisY, opacity: .25})); svg.appendChild(sv('text', {class: 'ilabel', x: X(t), y: axisY + 16, 'text-anchor': 'middle'}, t)); }
    svg.appendChild(sv('line', {class: 'axis', x1: left, y1: axisY, x2: W - right, y2: axisY}));

    this.newBar = null;
